<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة مسارك الذكية للشحن</title>
    <style>
        :root {
            --primary-orange: #ea580c;
            --container-bg: #ffedd5; /* برتقالي فاتح للصندوق */
            --page-bg: #fed7aa;      /* خلفية الصفحة موحدة */
            --dark-orange: #9a3412;
            --white: #ffffff;
            --text-dark: #292524;
        }

        body {
            font-family: Tahoma, sans-serif;
            background-color: var(--page-bg); /* خلفية موحدة */
            margin: 0;
            padding: 20px;
            direction: rtl;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--container-bg); /* الصندوق الرئيسي برتقالي فاتح */
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(154, 52, 18, 0.15);
            border: 2px solid #fb923c;
        }

        h2 {
            color: var(--dark-orange);
            text-align: center;
            margin-bottom: 5px;
            font-size: 26px;
        }

        .subtitle {
            text-align: center;
            color: #7c2d12;
            font-size: 14px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .step-box { display: none; }
        .active { display: block; animation: fadeIn 0.4s ease-in-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--dark-orange);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 2px solid #fb923c;
            border-radius: 10px;
            font-size: 14px;
            background-color: var(--white);
            transition: all 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-orange);
            box-shadow: 0 0 8px rgba(234, 88, 12, 0.3);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--primary-orange);
            color: var(--white);
            border: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(154, 52, 18, 0.2);
            transition: all 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background: var(--dark-orange);
            transform: translateY(-2px);
        }

        .secondary-btn {
            background: var(--white);
            color: var(--primary-orange);
            border: 2px solid var(--primary-orange);
            box-shadow: none;
        }

        .secondary-btn:hover {
            background: #fffaeb;
            color: var(--dark-orange);
        }

        .service-type-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .service-card {
            border: 2px solid #fb923c;
            padding: 12px;
            border-radius: 12px;
            background: var(--white);
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            font-size: 13px;
            color: #7c2d12;
        }

        .service-card:hover, .service-card.selected {
            border-color: var(--primary-orange);
            background: var(--primary-orange);
            color: var(--white);
            box-shadow: 0 4px 10px rgba(154,52,18,0.2);
        }

        .courier-card {
            border: 2px solid #fb923c;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 12px;
            background: var(--white);
            cursor: pointer;
            transition: all 0.2s;
        }

        .courier-card:hover {
            border-color: var(--dark-orange);
            background: #fffaeb;
            transform: scale(1.01);
        }

        .timeline {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        .timeline li {
            padding: 12px 0;
            border-right: 3px solid var(--primary-orange);
            margin-right: 10px;
            padding-right: 18px;
            position: relative;
            font-size: 14px;
        }

        .badge {
            background-color: var(--white);
            color: var(--dark-orange);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
            border: 1px solid #fb923c;
        }

        .summary-box {
            background: var(--white);
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #fb923c;
            margin-bottom: 15px;
            line-height: 1.8;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🚚 مسارك</h2>
    <div class="subtitle">منصة الشحن والخدمات اللوجستية الذكية</div>

    <!-- الخطوة 1: تسجيل الشحنة والخدمة -->
    <div id="step1" class="step-box active">
        <div class="badge">الخطوة 1: تفاصيل الشحنة والمسار</div>
        
        <div class="form-group">
            <label>🧭 اختر نمط الخدمة اللوجستية:</label>
            <div class="service-type-grid">
                <div class="service-card selected" onclick="selectServiceType(this, 'من الباب للباب')">🚪 من الباب للباب</div>
                <div class="service-card" onclick="selectServiceType(this, 'من الباب للفرع')">🏢 من الباب للفرع</div>
                <div class="service-card" onclick="selectServiceType(this, 'من الفرع للباب')">📦 من الفرع للباب</div>
                <div class="service-card" onclick="selectServiceType(this, 'من الفرع للفرع')">🏬 من الفرع للفرع</div>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>📍 مدينة الاستلام:</label>
                <select id="pickupCity">
                    <option value="الرياض">الرياض</option>
                    <option value="جدة">جدة</option>
                    <option value="مكة المكرمة">مكة المكرمة</option>
                    <option value="الدمام">الدمام</option>
                    <option value="المدينة المنورة">المدينة المنورة</option>
                    <option value="أبها">أبها</option>
                    <option value="تبوك">تبوك</option>
                </select>
            </div>
            <div class="form-group">
                <label>🏁 مدينة التسليم:</label>
                <select id="deliveryCity">
                    <option value="جدة">جدة</option>
                    <option value="الرياض">الرياض</option>
                    <option value="مكة المكرمة">مكة المكرمة</option>
                    <option value="الدمام">الدمام</option>
                    <option value="المدينة المنورة">المدينة المنورة</option>
                    <option value="أبها">أبها</option>
                    <option value="تبوك">تبوك</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>⚖️ وزن الشحنة وحجمها:</label>
            <select id="weightOption">
                <option value="ظرف مستندات (أقل من 1 كجم)">📄 ظرف مستندات
