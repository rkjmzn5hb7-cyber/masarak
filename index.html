<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مسارك الذكية للشحن | Masarak Smart Logistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0b1f3a;
  --ink2: #16355c;
  --teal: #0e7c86;
  --teal-d: #0a5f67;
  --tealbg: #e6f4f5;
  --amber: #d98a1f;
  --ambbg: #fdf3e1;
  --bg: #f0f4f8;
  --card: #ffffff;
  --sec-bg: #f8fafc;
  --line: #d9e2ec;
  --mut: #5b6b7e;
  --danger: #dc2626;
  --r: 16px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px 14px 40px;
  background: var(--bg);
  color: var(--ink);
  font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif;
  line-height: 1.7;
  font-size: 14.5px;
}

body > * {
  max-width: 860px;
  margin-inline: auto;
}

.i {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
  vertical-align: -3px;
}
.i.fill { fill: currentColor; stroke: none; }
[dir=rtl] .arr { transform: scaleX(-1); }

/* الشريط العلوي */
.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  background: var(--ink);
  color: #fff;
  border-radius: var(--r);
  padding: 14px 20px;
  margin-bottom: 22px;
  box-shadow: 0 8px 24px rgba(11, 31, 58, 0.12);
}
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--teal);
  display: grid;
  place-items: center;
}
.logo .i { width: 24px; height: 24px; }
.bt { font-weight: 700; font-size: 18px; line-height: 1.25; }
.bs { font-size: 12px; color: #a9c4de; }
.acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: 99px;
  font-size: 12.5px;
  font-weight: 600;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.18);
  color: #fff;
}

button { font-family: inherit; cursor: pointer; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 14px 18px;
  border: 0;
  border-radius: 12px;
  background: var(--teal);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  transition: background 0.15s, transform 0.15s;
}
.btn:hover { background: var(--teal-d); }
.btn:active { transform: scale(0.99); }
.btn.sec {
  background: #fff;
  color: var(--teal);
  border: 1.5px solid var(--teal);
}
.btn.sec:hover { background: var(--tealbg); }
.btn.dark {
  background: var(--ink);
  color: #fff;
}
.btn.dark:hover { background: var(--ink2); }
.btn.sm {
  width: auto;
  padding: 8px 14px;
  font-size: 13px;
  border-radius: 10px;
}
.btn.danger {
  background: #fee2e2;
  color: var(--danger);
  border: 1px solid #fca5a5;
}

.nav-btns {
  display: flex;
  gap: 12px;
  margin-top: 26px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
}
.nav-btns .btn { margin-top: 0; }

.nbtn {
  width: auto;
  margin: 0;
  padding: 7px 14px;
  font-size: 12.5px;
  border-radius: 99px;
  background: var(--teal);
}
.nbtn.ghost {
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.35);
}

:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

/* البطاقة الرئيسية */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 28px 24px;
  margin-bottom: 24px;
  box-shadow: 0 10px 30px rgba(11, 31, 58, 0.06);
}

.header-wrap {
  text-align: center;
  margin-bottom: 24px;
}
h2 { margin: 0 0 6px; font-size: 24px; color: var(--ink); }
.sub { color: var(--mut); font-size: 13.5px; margin: 0; }

/* شريط التقدم (5 خطوات مستقلة) */
.prog {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin-bottom: 28px;
}
@media (max-width: 680px) {
  .prog { grid-template-columns: repeat(2, 1fr); }
  .prog .ps:last-child { grid-column: span 2; }
}
.ps {
  padding: 10px 8px;
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  border-radius: 12px;
  background: var(--sec-bg);
  color: var(--mut);
  border: 1px solid var(--line);
  border-bottom: 3.5px solid var(--line);
  transition: 0.25s;
}
.ps.cur {
  background: var(--tealbg);
  color: var(--teal-d);
  border-color: var(--teal);
  font-weight: 700;
}
.ps.done {
  background: #fff;
  color: var(--ink);
  border-color: var(--ink2);
}

/* الأقسام الداخلية */
.sec-box {
  background: var(--sec-bg);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
}
.sec-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  margin: 0 0 16px;
  padding-bottom: 10px;
  border-bottom: 1px dashed var(--line);
}
.sec-title-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.save-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  color: var(--teal-d);
  background: var(--tealbg);
  padding: 4px 12px;
  border-radius: 99px;
  font-weight: 600;
}

/* بطاقة بوليصة ضمن الدفعة (في الخطوة 2) */
.wb-item-card {
  background: #fff;
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 16px;
  position: relative;
  box-shadow: 0 3px 10px rgba(11, 31, 58, 0.03);
}
.wb-item-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.wb-num-badge {
  background: var(--ink);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 99px;
}

/* لوحة المسار النشط تحت المدن */
.dash {
  background: var(--ink);
  color: #fff;
  border-radius: 18px;
  padding: 20px;
  margin: 18px 0 6px;
  box-shadow: 0 10px 26px rgba(11, 31, 58, 0.16);
}
.dh {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.dt {
  font-weight: 700;
  font-size: 15px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.live {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: #7fe0c3;
  background: rgba(47, 212, 160, 0.12);
  padding: 4px 10px;
  border-radius: 99px;
}
.live:before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #2fd4a0;
  animation: pl 1.8s infinite;
}
@keyframes pl { 50% { opacity: 0.3; } }

.kpis {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 14px 0;
}
.kpi {
  background: rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  padding: 10px 12px;
  text-align: center;
}
.kpi b { display: block; font-size: 18px; color: #fff; }
.kpi span { font-size: 11.5px; color: #a9c4de; }

.hw {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  font-size: 12.5px;
  color: #c4d8ea;
  background: rgba(255, 255, 255, 0.05);
  padding: 8px 12px;
  border-radius: 10px;
}
.hwc {
  background: var(--amber);
  color: #1b1200;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 7px;
  font-size: 11.5px;
}

.nodes {
  display: flex;
  justify-content: space-between;
  position: relative;
  margin-top: 20px;
  gap: 6px;
}
.nodes:before, .nodes:after {
  content: "";
  position: absolute;
  top: 14px;
  inset-inline: 24px;
  height: 3px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.18);
}
.nodes:after {
  background: linear-gradient(90deg, transparent, #2fd4a0, transparent);
  background-size: 40% 100%;
  background-repeat: no-repeat;
  animation: fl 2.6s linear infinite;
}
@keyframes fl { from { background-position: -40% 0; } to { background-position: 140% 0; } }

.node {
  flex: 1;
  min-width: 56px;
  text-align: center;
  position: relative;
  z-index: 2;
}
.dot {
  width: 30px;
  height: 30px;
  margin: 0 auto 6px;
  border-radius: 50%;
  background: var(--ink2);
  border: 2px solid #2fd4a0;
  display: grid;
  place-items: center;
}
.dot .i { width: 14px; height: 14px; }
.node.end .dot { background: #2fd4a0; color: var(--ink); }
.nc { font-size: 12px; font-weight: 600; line-height: 1.3; }
.nh { font-size: 11px; color: #9fc0dc; margin-top: 2px; }

/* الحقول */
.fg { margin-bottom: 16px; }
.fg:last-child { margin-bottom: 0; }
label, .lb {
  display: block;
  margin-bottom: 7px;
  font-weight: 600;
  font-size: 13.5px;
  color: var(--ink2);
}
input, select, textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--line);
  border-radius: 11px;
  font: inherit;
  background: #fff;
  color: var(--ink);
  transition: border-color 0.2s, box-shadow 0.2s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(14, 124, 134, 0.15);
}

.g2 { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 600px) {
  .g2 { grid-template-columns: 1fr 1fr; }
}

.cities {
  display: grid;
  gap: 12px;
  grid-template-columns: 1fr;
  align-items: end;
}
@media (min-width: 600px) {
  .cities { grid-template-columns: 1fr auto 1fr; }
}
.swap {
  width: 44px;
  height: 44px;
  margin: 0 auto 2px;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  background: #fff;
  color: var(--teal);
  display: grid;
  place-items: center;
  transition: transform 0.35s, background 0.2s;
}
.swap:hover { background: var(--tealbg); transform: rotate(180deg); }

.step { display: none; }
.step.on { display: block; animation: in 0.3s ease-out; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } }

.step-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 18px;
}
.badge {
  display: inline-block;
  background: var(--tealbg);
  color: var(--teal-d);
  border-radius: 99px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 700;
}

.opt { display: grid; gap: 10px; margin-bottom: 16px; }
.o3 { grid-template-columns: repeat(3, 1fr); }
.o2 { grid-template-columns: 1fr 1fr; }
@media (max-width: 500px) {
  .o3, .o2 { grid-template-columns: 1fr; }
}

.oc {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-align: center;
  padding: 14px 10px;
  border: 1.5px solid var(--line);
  border-radius: 13px;
  background: #fff;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink2);
  cursor: pointer;
  transition: all 0.2s;
}
.oc:hover { border-color: var(--teal); }
.oc.sel {
  border-color: var(--teal);
  background: var(--tealbg);
  color: var(--teal-d);
  box-shadow: inset 0 0 0 1px var(--teal);
}

.b2b {
  display: none;
  background: #fff;
  border: 1.5px solid var(--teal);
  border-radius: 14px;
  padding: 16px;
  margin-top: 14px;
}
.b2b.show { display: block; animation: in 0.25s; }

.tp {
  padding: 12px 8px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  background: var(--sec-bg);
  text-align: center;
  font-size: 12.5px;
  cursor: pointer;
  transition: 0.2s;
}
.tp.sel { border-color: var(--teal); background: var(--tealbg); font-weight: 700; }
.tp b { display: block; font-size: 15px; color: var(--teal-d); margin-top: 3px; }

.hint {
  background: var(--tealbg);
  border-inline-start: 4px solid var(--teal);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 13px;
  margin-top: 12px;
}

/* الفروع والشركات */
.br {
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
  cursor: pointer;
  background: #fff;
  transition: all 0.2s;
}
.br:hover { border-color: var(--teal); transform: translateY(-1px); }
.br.sel {
  border-color: var(--teal);
  background: var(--tealbg);
  box-shadow: 0 4px 14px rgba(14, 124, 134, 0.12);
}
.bt2 {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  font-weight: 700;
  font-size: 14px;
}
.tag {
  font-size: 11.5px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 99px;
  background: var(--bg);
  color: var(--mut);
}
.tag.fast { background: var(--ambbg); color: #8a5200; }
.meta { font-size: 12.5px; color: var(--mut); margin: 6px 0 8px; }
.bar { height: 8px; border-radius: 6px; background: #e3e9f0; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 6px; background: var(--teal); transition: width 0.4s; }
.bar i.f { background: var(--amber); }

.sumbox {
  background: var(--sec-bg);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 18px;
  line-height: 1.9;
  font-size: 13.5px;
}

.cc {
  border: 1.5px solid var(--line);
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 14px;
  cursor: pointer;
  background: #fff;
  transition: all 0.18s;
}
.cc:hover {
  border-color: var(--teal);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(14, 124, 134, 0.14);
}
.ch {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 8px;
}
.dep {
  background: var(--ambbg);
  color: #8a5200;
  font-size: 12px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 99px;
}
.rp {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed var(--line);
  font-size: 12.5px;
  color: var(--mut);
}

.hub {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  margin: 16px 0;
}
.ok { font-size: 13px; color: var(--teal-d); font-weight: 600; margin-top: 8px; }

/* تصميم بوليصة الشحن الرسمية والباركود */
.waybills-grid {
  display: flex;
  flex-direction: column;
  gap: 20px;
  margin: 20px 0;
}
.waybill-ticket {
  background: #fff;
  border: 2px solid var(--ink);
  border-radius: 16px;
  padding: 20px;
  position: relative;
  box-shadow: 0 6px 18px rgba(11, 31, 58, 0.08);
}
.wb-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--ink);
  margin-bottom: 14px;
}
.wb-brand {
  font-weight: 700;
  font-size: 16px;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
}
.wb-route-banner {
  background: var(--sec-bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 14px;
  margin-bottom: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 13px;
}
.wb-parties-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 14px;
}
@media (max-width: 560px) {
  .wb-parties-grid { grid-template-columns: 1fr; }
}
.wb-party-box {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  background: #fcfdfe;
  font-size: 13px;
}
.wb-party-box h4 {
  margin: 0 0 6px;
  font-size: 13px;
  color: var(--teal-d);
  border-bottom: 1px dashed var(--line);
  padding-bottom: 4px;
}
.wb-notes-row {
  background: var(--ambbg);
  border: 1px solid #f5d08a;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 12.5px;
  margin-bottom: 14px;
}
.wb-barcode-box {
  text-align: center;
  padding: 12px;
  background: #fff;
  border: 1px dashed var(--ink2);
  border-radius: 10px;
  margin-bottom: 12px;
}
.wb-barcode-box svg {
  max-width: 100%;
  height: 58px;
}
.wb-barcode-code {
  font-family: monospace;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--ink);
  margin-top: 4px;
}

/* الخط الزمني */
.tl {
  list-style: none;
  margin: 16px 0 0;
  padding: 0;
  border-inline-start: 3px solid var(--line);
  margin-inline-start: 10px;
}
.tl li { position: relative; padding: 6px 20px 18px; }
.tl li:before {
  content: "";
  position: absolute;
  inset-inline-start: -9.5px;
  top: 10px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid var(--teal);
}
.tl li.end:before { background: var(--teal); }
.tl li.start:before { border-color: var(--ink); }
.th {
  display: inline-block;
  background: var(--ink);
  color: #fff;
  font-size: 11.5px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 99px;
  margin-bottom: 4px;
}
.tl small { display: block; color: var(--mut); font-size: 12.5px; margin-top: 2px; }

/* التقييمات */
.rv {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
}
.avg {
  background: var(--ink);
  color: #fff;
  border-radius: 99px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 700;
  display: inline-flex;
  gap: 6px;
  align-items: center;
}
.stars { display: flex; gap: 6px; margin-bottom: 12px; }
.sb {
  width: 40px;
  height: 40px;
  margin: 0;
  padding: 0;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  background: #fff;
  color: #b6c1ce;
  display: grid;
  place-items: center;
}
.sb.on { background: var(--amber); border-color: var(--amber); color: #fff; }
.rl { display: grid; gap: 12px; grid-template-columns: 1fr; margin-top: 16px; }
@media (min-width: 600px) { .rl { grid-template-columns: 1fr 1fr; } }
.rc {
  background: var(--sec-bg);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  font-size: 13px;
}
.rt {
  display: flex;
  justify-content: space-between;
  font-weight: 700;
  margin-bottom: 6px;
  color: var(--ink2);
}
.rt .s { color: var(--amber); display: flex; }
.rr {
  display: inline-block;
  font-size: 11.5px;
  color: var(--teal-d);

  </div>

  <!-- شريط 5 خطوات واضحة ومفصولة -->
  <div class="prog">
    <div class="ps cur" id="prog1" data-i="p1"></div>
    <div class="ps" id="prog2" data-i="p2"></div>
    <div class="ps" id="prog3" data-i="p3"></div>
    <div class="ps" id="prog4" data-i="p4"></div>
    <div class="ps" id="prog5" data-i="p5"></div>
  </div>

      <div class="badge" data-i="bd1"></div>
      <span class="save-badge"><svg class="i"><use href="#shield"/></svg><span data-i="isolatedSave"></span></span>
    </div>

    <div class="sec-box">
      <div class="sec-title">
        <div class="sec-title-left"><svg class="i"><use href="#user"/></svg><span data-i="lClient"></span></div>
      </div>

      <div class="opt o3">
        <div class="oc" id="c-guest" tabindex="0" onclick="selectClient('guest')"><svg class="i"><use href="#bolt"/></svg><span data-i="guest"></span></div>
        <div class="oc sel" id="c-individual" tabindex="0" onclick="selectClient('individual')"><svg class="i"><use href="#user"/></svg><span data-i="indivPc"></span></div>
        <div class="oc" id="c-corporate" tabindex="0" onclick="selectClient('corporate')"><svg class="i"><use href="#bldg"/></svg><span data-i="corpPc"></span></div>
      </div>

      <div class="g2" style="margin-top:14px">

        </div>
        <div class="fg">
          <label for="acctName" id="lblAcctName" data-i="lAcctName"></label>

    <div id="couriers"></div>

    <div class="nav-btns">
      <button type="button" class="btn sec" onclick="goStep(3)">
        <span data-i="backTo3"></span>
      </button>
    </div>
  </div>

  <div id="step5" class="step">
    <div class="step-head">
      <div class="badge" data-i="bd5"></div>

      </div>
      <ol class="tl" id="timelineList"></ol>
    </div>

    <div class="nav-btns">
      <button type="button" class="btn sec" onclick="goStep(4)">
        <span data-i="backTo4"></span>
      </button>
      <button type="button" class="btn" onclick="startNewBatch()">
        <svg class="i"><use href="#box"/></svg><span data-i="reset"></span>
      </button>
    </div>
  </div>
</div>

function onAcctPhoneInput() {
  const rawPhone = $('acctPhone').value.trim();
  acctPhone = rawPhone;
  if (rawPhone.length >= 9) {
    try {
      const saved = localStorage.getItem(ACCT_PREFIX + rawPhone);
      if (saved) {
        const d = JSON.parse(saved);
        if (d.acctName) {
          acctName = d.acctName;
          $('acctName').value = d.acctName;
        }
        if (d.ctype) selectClient(d.ctype, false);
        if (d.corpTier) setTier(d.corpTier, false);
        if (d.from && $('from')) $('from').value = d.from;
        if (d.to && $('to')) $('to').value = d.to;
      }
    } catch (e) {}
  }
  saveAccountProfile();
}

function saveAccountProfile() {
  acctPhone = $('acctPhone')?.value.trim() || '';
  acctName = $('acctName')?.value.trim() || '';
  updatePill();
  if (!acctPhone || acctPhone.length < 4) return;
  try {
    localStorage.setItem(ACTIVE_PHONE_KEY, acctPhone);
    const profile = {
      acctPhone,
      acctName,
      ctype,
      corpTier,
      from: $('from')?.value || 'جازان',
      to: $('to')?.value || 'جدة',
      svc
    };
    localStorage.setItem(ACCT_PREFIX + acctPhone, JSON.stringify(profile));
  } catch (e) {}
}

function loadInitialSession() {
  try {
    const revSaved = localStorage.getItem(REVIEWS_KEY);
    if (revSaved) userReviews = JSON.parse(revSaved);

    const lastPhone = localStorage.getItem(ACTIVE_PHONE_KEY);
    if (!lastPhone) return;
    const raw = localStorage.getItem(ACCT_PREFIX + lastPhone);
    if (!raw) return;
    const d = JSON.parse(raw);
    acctPhone = d.acctPhone || '';
    acctName = d.acctName || '';
    if ($('acctPhone')) $('acctPhone').value = acctPhone;
    if ($('acctName')) $('acctName').value = acctName;
    if (d.ctype) ctype = d.ctype;
    if (d.corpTier) corpTier = d.corpTier;
    if (d.from && $('from')) $('from').value = d.from;
    if (d.to && $('to')) $('to').value = d.to;
    if (d.svc) svc = d.svc;
  } catch (e) {}
}

function logoutAccount() {
  try { localStorage.removeItem(ACTIVE_PHONE_KEY); } catch (e) {}
  acctPhone = '';
  acctName = '';
  $('acctPhone').value = '';
  $('acctName').value = '';
  waybillsDraft = [];
  selectClient('individual', false);
  updatePill();
  goStep(1);
}

/* ---------- توليد باركود SVG مخصص وفريد لكل بوليصة ---------- */
function generateBarcodeSVG(codeStr) {
  let bars = [];
  // نمط بداية الباركود
  bars.push(2, 1, 1, 2, 3, 1);
  for (let i = 0; i < codeStr.length; i++) {
    const ch = codeStr.charCodeAt(i);
    const b1 = (ch % 3) + 1;
    const s1 = ((ch >> 2) % 2) + 1;
    const b2 = ((ch >> 3) % 3) + 1;
    const s2 = ((ch >> 5) % 2) + 1;
    bars.push(b1, s1, b2, s2);
  }
  // نمط نهاية الباركود
  bars.push(3, 1, 1, 2, 1, 2);

  let x = 8;
  let rects = '';
  for (let i = 0; i < bars.length; i++) {
    const w = bars[i] * 1.9;
    if (i % 2 === 0) {
      rects += `<rect x="${x.toFixed(1)}" y="4" width="${w.toFixed(1)}" height="48" fill="#0b1f3a"/>`;
    }
    x += w;
  }
  const totalW = Math.ceil(x + 8);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${totalW} 56" width="100%" height="56">${rects}</svg>`;
}

/* ---------- حساب المسافات والمحطات ---------- */
function dist(a, b) {
  const g = CMAP[a] || { lat: 21.5, lon: 39.2 }, h = CMAP[b] || { lat: 24.7, lon: 46.7 }, R = 6371, r = Math.PI / 180;
  const dl = (h.lat - g.lat) * r, dn = (h.lon - g.lon) * r, x = Math.sin(dl / 2) ** 2 + Math.cos(g.lat * r) * Math.cos(h.lat * r) * Math.sin(dn / 2) ** 2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x)) * 1.28);
}
function hwOf(f, t2) {
  const both = a => a.includes(f) && a.includes(t2);
  return both(COAST) ? 'coast' : both(SOUTH) ? 'south' : both(WEST) ? 'w40' : both(NORTH) ? 'north' : 'nat';
}
function buildRoute(f, t2) {
  const hw = hwOf(f, t2);
  if (f === t2) return { hw, hrs: 1.5, km: 25, legs: [{ c: f, add: 0, cum: 0, km: 0, k: 'local' }, { c: t2, add: 1.5, cum: 1.5, km: 25, k: 'end' }] };
  const ex = a => {
    const i = a.indexOf(f), j = a.indexOf(t2);
    if (i < 0 || j < 0 || Math.abs(j - i) < 2) return null;
    const s = j > i ? 1 : -1, r = [];
    for (let k = i + s; k !== j; k += s) r.push(a[k]);
    return r;
  };
  let mid = [];
  const jj = (f === 'جازان' && t2 === 'جدة') || (f === 'جدة' && t2 === 'جازان');
  const cS = ex(COAST), sS = ex(SOUTH), wS = ex(WEST_ORD), nS = ex(NORTH_ORD);
  if (jj) mid = f === 'جازان' ? ['الدرب','القنفذة','الليث'] : ['الليث','القنفذة','الدرب'];
  else if (cS) mid = cS.filter(c => ['بيش','الدرب','القنفذة','الليث','جدة','رابغ','ينبع','الوجه','ضباء'].includes(c)).slice(0, 4);
  else if (sS) mid = sS.filter(c => ['الدرب','أبها','بيشة','وادي الدواسر','الخرج'].includes(c)).slice(0, 4);
  else if (wS) mid = wS.filter(c => ['مكة المكرمة','الطائف','الدوادمي','الرياض','الأحساء (الهفوف)'].includes(c)).slice(0, 4);
  else if (nS) mid = nS.filter(c => ['المجمعة','بريدة','حائل','سكاكا (الجوف)'].includes(c)).slice(0, 4);
  else {
    const D = dist(f, t2);
    if (D > 200) {
      const valid = [];
      ['الدرب','القنفذة','الليث','جدة','الطائف','أبها','بيشة','وادي الدواسر','الدوادمي','الرياض','المجمعة','بريدة','حائل','ينبع','المدينة المنورة','الأحساء (الهفوف)'].forEach(h => {
        if (h === f || h === t2) return;
        const d1 = dist(f, h), d2 = dist(h, t2);
        if (d1 + d2 <= D * 1.24 && d1 > 75 && d2 > 75) valid.push({ h, d1 });
      });
      valid.sort((a, b) => a.d1 - b.d1);
      if (valid.length === 1) mid = [valid[0].h];
      else if (valid.length === 2) mid = [valid[0].h, valid[1].h];
      else if (valid.length >= 3) mid = [valid[0].h, valid[Math.floor(valid.length / 2)].h, valid[valid.length - 1].h];
    }
  }
  const chain = [f, ...mid, t2], legs = [];
  let cum = 0, km = 0;
  chain.forEach((c, i) => {
    if (!i) { legs.push({ c, add: 0, cum: 0, km: 0, k: 'start' }); return; }
    const s = dist(chain[i - 1], c);
    km += s;
    const h = Math.max(1, Math.round(s / 80 * 2) / 2);
    cum = Math.round((cum + h) * 2) / 2;
    legs.push({ c, add: h, cum, km: s, k: i === chain.length - 1 ? 'end' : 'stop' });
  });
  if (jj && legs.length === 5) {
    let seg = [[125, 1.5], [215, 3.5], [170, 3], [205, 4]];
    if (f === 'جدة') seg = seg.reverse();
    cum = 0; km = 0;
    seg.forEach((s, i) => { cum += s[1]; km += s[0]; Object.assign(legs[i + 1], { km: s[0], add: s[1], cum }); });
  }
  return { hw, hrs: cum, km: Math.max(35, km), legs };
}
const chainTxt = legs => legs.map(l => city(l.c)).join(isEn() ? ' → ' : ' ← ');

function buildSelects() {

    el.value = cur;

  rEl.innerHTML = [0, 1, 2, 3].map(i => `<option value="${i}">${t('r' + i)}</option>`).join('');
  rEl.value = rCur;
}

function onRoute() {

      <div class="bar"><i class="${i === 0 ? 'f' : ''}" style="width:${p}%"></i></div>

}

/* ---------- التنقل بين الخطوات الـ 5 ---------- */
function goStep(n) {
  if ($('step2').classList.contains('on')) syncWaybillInputsFromDOM();
  [1, 2, 3, 4, 5].forEach(i => {
    $('step' + i).classList.toggle('on', i === n);
    $('prog' + i).classList.toggle('cur', i === n);
    $('prog' + i).classList.toggle('done', i < n);
  });
  if (n === 2) initWaybillsDraft();
  if (n === 4) renderCouriersStep();
  updatePill();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function nextFromStep1() {
  acctPhone = $('acctPhone').value.trim();
  acctName = $('acctName').value.trim();
  const errEl = $('step1Err');
  if (ctype !== 'guest' && (!acctPhone || !acctName)) {
    errEl.textContent = t('errStep1');
    errEl.classList.add('show');
    return;
  }
  errEl.classList.remove('show');
  saveAccountProfile();
  goStep(2);
}

function nextFromStep2() {
  syncWaybillInputsFromDOM();
  const errEl = $('step2Err');
  const invalid = waybillsDraft.some(wb => !wb.senderName.trim() || !wb.senderPhone.trim() || !wb.receiverName.trim() || !wb.receiverPhone.trim());
  if (invalid) {
    errEl.textContent = t('errStep2');
    errEl.classList.add('show');
    return;
  }
  errEl.classList.remove('show');
  goStep(3);
}

function renderCouriersStep() {
  const f = $('from').value, to = $('to').value;
  const wbCount = waybillsDraft.length;
  const route = buildRoute(f, to);
  ship = {
    ctype,
    corpTier,
    wbCount,
    svc,
    from: f,
    to,
    bi: bIdx,
    r: +$('ready').value,
    waybills: JSON.parse(JSON.stringify(waybillsDraft)),
    route,
    cIdx: 0
  };

  const s = ship, b = BR[s.bi], hw = HW[s.route.hw], ch = chainTxt(s.route.legs);
  const after = Math.min(100, b.load + s.wbCount);
  const wait = after >= 100 ? 0.5 : b.eta;
  const bn = `${t('b' + s.bi)} (${city(s.from)})`;

  $('shipSum').innerHTML = `
    ${t('batchCount')}: <b>${num(s.wbCount)} ${t('wbUnit')}</b> | ${t('origin')}: <b style="color:var(--teal-d)">${bn}</b> (${t('occB')}: <b>${b.load}%</b> → <b>${after}%</b> ${t('after')})<br>
    ${t('hwL')}: <b>${hw.code[lang]}</b> — ${hw.name[lang]}<br>
    ${t('stopsL')} (${num(s.route.km)} ${t('km')}): <b>${ch}</b> | ${t('roadT')}: <b>${num(s.route.hrs)} ${t('hrs')}</b>
  `;

  const mult = s.svc === 'd2d' ? 1.25 : s.svc === 'b2b' ? 0.85 : s.svc === 'hub' ? 0.95 : 1;
  const add = Math.min(12, Math.floor(s.route.km / 250) * 3);
  const bu = unitB2B(s.corpTier);

  const base = [
    { n: { ar: 'مسارك إكسبريس (سمسا: الخط السريع المباشر)', en: 'Masarak Express (SMSA Direct Line)' }, ip: 35, cp: bu, sf: 1.0, rt: '4.9' },
    { n: { ar: 'درة اللوجستية (أرامكس: خط المحافظات)', en: 'Durrah Logistics (Aramex Regional Line)' }, ip: 31, cp: Math.max(20, bu - 2), sf: 1.15, rt: '4.7' },
    { n: { ar: 'الناقل الوطني الموحد (سبل)', en: 'National Unified Carrier (SPL)' }, ip: 24, cp: Math.max(18, bu - 4), sf: 1.3, rt: '4.6' }
  ];

  cour = base.map(c => {
    const corp = s.ctype === 'corporate';
    const unit = corp ? c.cp : Math.round((c.ip + add) * mult);
    const tot = unit * s.wbCount;
    const rh = Math.max(1.5, Math.round(s.route.hrs * c.sf * 2) / 2);
    const te = Math.round((rh + wait) * 2) / 2;
    return {
      n: c.n, unit, tot, corp, sf: c.sf, rt: c.rt, rh, wait, te, after,
      dep: after >= 100 ? t('full') : t('dep', { p: after, h: b.eta })
    };
  });

  $('couriers').innerHTML = `<div class="lb" style="margin-bottom:10px">${t('chooseC')}</div>` + cour.map((c, i) => {
    const cost = s.wbCount > 1
      ? `${c.unit} ${t('sar')}/${t('wbUnit')} (${t('total2')}: ${num(c.tot)} ${t('sar')})`
      : `${c.unit} ${t('sar')}`;
    const wt = c.wait === 0.5 ? t('immed') : `${num(c.wait)} ${t('h')} ${t('wait')}`;
    return `<div class="cc" tabindex="0" onclick="goTrack(${i})" onkeydown="if(event.key==='Enter')goTrack(${i})">
      <div class="ch"><b>${ic('truck')} ${c.n[lang]}</b><span class="dep">${c.dep}</span></div>
      ${t('cost')}: <b style="color:var(--teal-d)">${cost}</b> | <span style="color:var(--amber)">${ic('star', 'fill')}</span> ${c.rt}<br>
      ${t('totalT')}: <b>${num(c.rh)} ${t('h')} ${t('road')} + ${wt} = ${num(c.te)} ${t('hrs')} ${t('total2')}</b>
      <div class="rp">${ch} | ${t('truckOcc')}: <b>${c.after}%</b><div class="bar" style="margin-top:6px"><i class="${c.after >= 95 ? 'f' : ''}" style="width:${c.after}%"></i></div></div>
    </div>`;
  }).join('');
}

function goTrack(ci) {
  ship.cIdx = ci;
  const s = ship, c = cour[ci], legs = s.route.legs, hw = HW[s.route.hw], bn = `${t('b' + s.bi)} (${city(s.from)})`;

  // توليد رقم بوليصة وباركود فريد لكل شحنة في الدفعة
  const baseStamp = Date.now().toString().slice(-5);
  s.waybills.forEach((wb, idx) => {
    if (!wb.waybillId) {
      const randPart = Math.floor(100 + Math.random() * 899);
      wb.waybillId = `MSK-${baseStamp}${randPart}-${idx + 1}`;
    }
  });

  let run = 0;
  const items = legs.map((l, i) => {
    if (i === 0) return `<li class="start"><span class="th">${t('hour0')}</span><b>${city(l.c)}</b><small>${bn} — ${c.dep}</small></li>`;
    const h = Math.max(1, Math.round(l.add * c.sf * 2) / 2);
    run = Math.round((run + h) * 2) / 2;
    const tag = `+${num(h)} ${t('h')} (${num(l.km)} ${t('km')}) | ${t('cum')}: ${num(run)} ${t('hrs')}`;
    if (i === legs.length - 1) return `<li class="end"><span class="th">${tag}</span><b>${city(l.c)}</b><small>${s.svc === 'd2d' ? t('n_endD') : t('n_endH')}</small></li>`;
    return `<li><span class="th">${tag}</span><b>${t('stopAt')} ${city(l.c)}</b><small>${t('n_stop')}</small></li>`;
  }).join('');

  const d = city(s.to), d2 = s.svc === 'd2d';
  const opts = d2 ? [t('hD0'), t('hD1')] : [t('hN') + ' (' + d + ')', t('hM') + ' (' + d + ')', t('hS') + ' (' + d + ')'];
  const cost = `${num(c.tot)} ${t('sar')} (${num(s.wbCount)} × ${c.unit} ${t('sar')})`;

  $('trackBox').innerHTML = `
    ${t('carrier')}: <b>${c.n[lang]}</b> | ${t('appr')}: <b style="color:var(--teal-d)">${cost}</b><br>
    ${t('hwL')}: <b>${hw.code[lang]}</b> — ${hw.name[lang]}<br>
    ${t('depL')}: <b style="color:var(--amber)">${bn} — ${c.dep}</b>
    <div class="hub">
      <label for="hubSel">${d2 ? t('hubFinal', { c: d }) : t('hubPick', { c: d })}</label>
      <select id="hubSel" onchange="hubNote()">${opts.map((o, i) => `<option value="${i}">${o}</option>`).join('')}</select>
      <div class="ok" id="hubMsg">${ic('check')} ${d2 ? t('hOkD', { h: num(run) }) : t('hOkH', { c: d, h: num(run) })}</div>
    </div>
  `;

  // رسم بطاقات البوليصات مع الباركود المخصص لكل بوليصة
  const routeChain = chainTxt(legs);
  $('issuedWaybillsContainer').innerHTML = s.waybills.map((wb, idx) => {
    const svgBarcode = generateBarcodeSVG(wb.waybillId + '-' + wb.receiverPhone);
    const notesTxt = wb.notes.trim() || t('noNotes');
    return `
      <div class="waybill-ticket" id="wb_ticket_${idx}">
        <div class="wb-top">
          <div class="wb-brand">${ic('route')} ${t('brand')} — ${t('wbCardTitle', { n: idx + 1 })}</div>
          <button type="button" class="btn sm sec" onclick="downloadWaybillsPDF(${idx})">
            ${ic('print')} <span>${t('printOnePdf')}</span>
          </button>
        </div>
        <div class="wb-route-banner">
          <span><b>${city(s.from)}</b> ${isEn() ? '→' : '←'} <b>${city(s.to)}</b> (${hw.code[lang]})</span>
          <span><b>${c.n[lang]}</b> | ${c.unit} ${t('sar')}</span>
        </div>
        <div class="wb-parties-grid">
          <div class="wb-party-box">
            <h4>${ic('user')} ${t('senderLbl')}</h4>
            <div><b>${escapeAttr(wb.senderName)}</b></div>
            <div dir="ltr">${escapeAttr(wb.senderPhone)}</div>
            <div style="color:var(--mut);font-size:12px">${bn}</div>
          </div>
          <div class="wb-party-box">
            <h4>${ic('flag')} ${t('receiverLbl')}</h4>
            <div><b>${escapeAttr(wb.receiverName)}</b></div>
            <div dir="ltr">${escapeAttr(wb.receiverPhone)}</div>
            <div style="color:var(--mut);font-size:12px">${city(s.to)} (${num(run)} ${t('hrs')})</div>
          </div>
        </div>
        <div class="wb-notes-row">
          <b>${t('lWeight')}:</b> ${t('w' + wb.weight)} &nbsp;|&nbsp; <b>${t('lNotes')}:</b> ${escapeAttr(notesTxt)}
        </div>
        <div class="wb-barcode-box">
          ${svgBarcode}
          <div class="wb-barcode-code">${wb.waybillId}</div>
        </div>
      </div>
    `;
  }).join('');

  $('timelineList').innerHTML = items;
  goStep(5);
}

function hubNote() {
  const sel = $('hubSel');
  $('hubMsg').innerHTML = ic('check') + ' ' + t('hConf') + sel.options[sel.selectedIndex].text;
}

/* ---------- تحميل وطباعة البوليصات PDF بنافذة مخصصة نظيفة ---------- */
function downloadWaybillsPDF(targetIdx) {
  if (!ship) return;
  const s = ship, c = cour[s.cIdx], hw = HW[s.route.hw], bn = `${t('b' + s.bi)} (${city(s.from)})`;
  const hubSel = $('hubSel');
  const destHubTxt = hubSel ? hubSel.options[hubSel.selectedIndex].text : city(s.to);
  const list = targetIdx === -1 ? s.waybills : [s.waybills[targetIdx]];
  const dir = isEn() ? 'ltr' : 'rtl';

  const pagesHtml = list.map((wb, i) => {
    const svgBarcode = generateBarcodeSVG(wb.waybillId + '-' + wb.receiverPhone);
    const notesTxt = wb.notes.trim() || t('noNotes');
    return `
      <div class="pdf-page">
        <div class="pdf-head">
          <div>
            <h1>${t('brand')}</h1>
            <small>${hw.code[lang]} — ${hw.name[lang]}</small>
          </div>
          <div class="pdf-id">${wb.waybillId}</div>
        </div>
        <div class="pdf-strip">
          <div><b>${t('origin')}:</b> ${bn}</div>
          <div><b>${t('lTo')}:</b> ${city(s.to)}</div>
          <div><b>${t('carrier')}:</b> ${c.n[lang]}</div>
          <div><b>${t('cost')}:</b> ${c.unit} ${t('sar')}</div>
        </div>
        <div class="pdf-grid">
          <div class="pdf-box">
            <h3>${t('senderLbl')}</h3>
            <p><b>${escapeAttr(wb.senderName)}</b></p>
            <p dir="ltr">${escapeAttr(wb.senderPhone)}</p>
            <p>${city(s.from)}</p>
          </div>
          <div class="pdf-box">
            <h3>${t('receiverLbl')}</h3>
            <p><b>${escapeAttr(wb.receiverName)}</b></p>
            <p dir="ltr">${escapeAttr(wb.receiverPhone)}</p>
            <p>${destHubTxt}</p>
          </div>
        </div>
        <div class="pdf-notes">
          <p><b>${t('lWeight')}:</b> ${t('w' + wb.weight)}</p>
          <p><b>${t('lNotes')}:</b> ${escapeAttr(notesTxt)}</p>
        </div>
        <div class="pdf-barcode">
          ${svgBarcode}
          <div class="pdf-code">${wb.waybillId}</div>
        </div>
      </div>
    `;
  }).join('');

  const win = window.open('', '_blank', 'width=840,height=900');
  if (!win) {
    window.print();
    return;
  }
  win.document.write(`<!DOCTYPE html><html lang="${lang}" dir="${dir}"><head><meta charset="UTF-8">
    <title>Waybills PDF - ${s.waybills[0].waybillId}</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      *{box-sizing:border-box}
      body{font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;margin:0;padding:20px;background:#fff;color:#0b1f3a}
      .pdf-page{border:2.5px solid #0b1f3a;border-radius:14px;padding:22px;margin-bottom:24px;page-break-inside:avoid}
      .pdf-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #0b1f3a;padding-bottom:12px;margin-bottom:14px}
      .pdf-head h1{margin:0;font-size:20px}
      .pdf-id{font-family:monospace;font-size:16px;font-weight:700;background:#0b1f3a;color:#fff;padding:6px 12px;border-radius:8px}
      .pdf-strip{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;background:#f0f4f8;padding:12px;border-radius:10px;margin-bottom:14px;font-size:13px}
      .pdf-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
      .pdf-box{border:1.5px solid #cbd5e1;border-radius:10px;padding:12px}
      .pdf-box h3{margin:0 0 8px;font-size:14px;color:#0e7c86;border-bottom:1px dashed #cbd5e1;padding-bottom:4px}
      .pdf-box p{margin:4px 0;font-size:13.5px}
      .pdf-notes{background:#fdf3e1;border:1px solid #d98a1f;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px}
      .pdf-notes p{margin:4px 0}
      .pdf-barcode{text-align:center;border:1.5px dashed #0b1f3a;border-radius:10px;padding:14px}
      .pdf-code{font-family:monospace;font-size:15px;font-weight:700;letter-spacing:3px;margin-top:6px}
      @media print{body{padding:0}.no-print{display:none}}
    </style></head><body>
    <div class="no-print" style="text-align:center;margin-bottom:16px">
      <button onclick="window.print()" style="padding:10px 24px;background:#0e7c86;color:#fff;border:0;border-radius:8px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer">
        ${isEn() ? 'Save as PDF / Print' : 'حفظ كملف PDF / طباعة'}
      </button>
    </div>
    ${pagesHtml}
    <script>window.onload=function(){setTimeout(function(){window.print()},350)}<\/script>
  </body></html>`);
  win.document.close();
}

function startNewBatch() {
  waybillsDraft = [];
  goStep(2);
}

/* ---------- التقييمات ---------- */
function drawStars() {
  $('stars').innerHTML = [1, 2, 3, 4, 5].map(n => `<button type="button" class="sb ${n <= stars ? 'on' : ''}" onclick="setStars(${n})" aria-label="${n}">${ic('star', 'fill')}</button>`).join('');
}
function setStars(n) { stars = n; drawStars(); }
function renderReviews() {
  const all = [...userReviews, ...REVIEWS];
  $('avg').textContent = '4.9 / 5.0 (' + t('rvCount', { n: num(126 + all.length) }) + ')';
  $('reviews').innerHTML = all.map(r => {
    const nm = typeof r.n === 'string' ? r.n : r.n[lang], cm = typeof r.c === 'string' ? r.c : r.c[lang];
    return `<div class="rc"><div class="rt"><span>${escapeAttr(nm)}</span><span class="s">${Array.from({ length: r.s }, () => ic('star', 'fill')).join('')}</span></div>
      <div class="rr">${city(r.f)} ${isEn() ? '→' : '←'} ${city(r.to)} (${HW[hwOf(r.f, r.to)].code[lang]})</div><div>${escapeAttr(cm)}</div></div>`;
  }).join('');
}
function submitReview() {
  const n = $('rvName').value.trim() || acctName || t('nameDef');
  const c = $('rvText').value.trim() || t('cmtDef');
  userReviews.unshift({ n, c, s: stars, f: $('from').value, to: $('to').value });
  $('rvName').value = '';
  $('rvText').value = '';
  try { localStorage.setItem(REVIEWS_KEY, JSON.stringify(userReviews)); } catch (e) {}
  renderReviews();
}

/* ---------- التشغيل الأولي ---------- */
window.addEventListener('DOMContentLoaded', () => {
  applyText();
  buildSelects();
  loadInitialSession();
  selectClient(ctype, false);
  setTier(corpTier, false);
  selectSvc(svc);
  drawStars();
  onRoute();
  renderReviews();
});
</script>
