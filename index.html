<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مسارك الذكية للشحن | Masarak Smart Logistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1f3a;--ink2:#16355c;--teal:#0e7c86;--teal-d:#0a5f67;--tealbg:#e6f4f5;--amber:#d98a1f;--ambbg:#fdf3e1;--bg:#f2f5f9;--card:#fff;--line:#d9e1ea;--mut:#5b6b7e;--r:14px}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;line-height:1.6;font-size:14px}
body>*{max-width:780px;margin-inline:auto}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.i.fill{fill:currentColor;stroke:none}
[dir=rtl] .arr{transform:scaleX(-1)}
.nav{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;background:var(--ink);color:#fff;border-radius:var(--r);padding:12px 16px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:11px;background:var(--teal);display:grid;place-items:center}
.logo .i{width:22px;height:22px}
.bt{font-weight:700;font-size:17px;line-height:1.2}.bs{font-size:11.5px;color:#a9c4de}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff}
button{font-family:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:0;border-radius:12px;background:var(--teal);color:#fff;font-size:15px;font-weight:600;margin-top:10px;transition:background .15s,transform .15s}
.btn:hover{background:var(--teal-d)}.btn:active{transform:scale(.98)}
.btn.sec{background:#fff;color:var(--teal);border:1.5px solid var(--teal)}.btn.sec:hover{background:var(--tealbg)}
.nbtn{width:auto;margin:0;padding:6px 12px;font-size:12px;border-radius:99px;background:var(--teal)}
.nbtn.ghost{background:transparent;border:1px solid rgba(255,255,255,.35)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 6px 22px rgba(11,31,58,.06)}
h2{margin:0 0 2px;font-size:23px}.sub{color:var(--mut);font-size:13px;margin-bottom:16px}
.prog{display:flex;gap:8px;margin-bottom:16px}
.ps{flex:1;padding:9px 6px;text-align:center;font-size:12px;font-weight:600;border-radius:10px;background:var(--bg);color:var(--mut);border-bottom:3px solid var(--line);transition:.25s}
.ps.cur{background:var(--tealbg);color:var(--teal-d);border-color:var(--teal)}.ps.done{color:var(--ink);border-color:var(--ink2)}
.dash{background:var(--ink);color:#fff;border-radius:16px;padding:16px;margin-bottom:18px}
.dh{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.dt{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#7fe0c3}
.live:before{content:"";width:8px;height:8px;border-radius:50%;background:#2fd4a0;animation:pl 1.8s infinite}
@keyframes pl{50%{opacity:.3}}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kpi{background:rgba(255,255,255,.07);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:17px}.kpi span{font-size:11px;color:#a9c4de}
.hw{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:#c4d8ea}
.hwc{background:var(--amber);color:#1b1200;font-weight:700;padding:2px 9px;border-radius:7px;font-size:11.5px}
.nodes{display:flex;justify-content:space-between;position:relative;margin-top:16px;gap:4px}
.nodes:before,.nodes:after{content:"";position:absolute;top:13px;inset-inline:22px;height:3px;border-radius:3px;background:rgba(255,255,255,.18)}
.nodes:after{background:linear-gradient(90deg,transparent,#2fd4a0,transparent);background-size:40% 100%;background-repeat:no-repeat;animation:fl 2.6s linear infinite}
@keyframes fl{from{background-position:-40% 0}to{background-position:140% 0}}
.node{flex:1;min-width:54px;text-align:center;position:relative;z-index:2}
.dot{width:28px;height:28px;margin:0 auto 5px;border-radius:50%;background:var(--ink2);border:2px solid #2fd4a0;display:grid;place-items:center}
.dot .i{width:14px;height:14px}.node.end .dot{background:#2fd4a0;color:var(--ink)}
.nc{font-size:11.5px;font-weight:600;line-height:1.25}.nh{font-size:10.5px;color:#9fc0dc}
.fg{margin-bottom:14px}
label,.lb{display:block;margin-bottom:6px;font-weight:600;font-size:13px;color:var(--ink2)}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,124,134,.15)}
.g2{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:560px){.g2{grid-template-columns:1fr 1fr}.rev{grid-template-columns:1fr 1fr}}
.cities{display:grid;gap:10px;grid-template-columns:1fr;align-items:end}
@media(min-width:560px){.cities{grid-template-columns:1fr auto 1fr}}
.swap{width:42px;height:42px;margin:0 auto 14px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--teal);display:grid;place-items:center;transition:transform .35s,background .2s}
.swap:hover{background:var(--tealbg);transform:rotate(180deg)}
.step{display:none}.step.on{display:block;animation:in .3s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.badge{display:inline-block;background:var(--tealbg);color:var(--teal-d);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700;margin-bottom:12px}
.opt{display:grid;gap:8px;margin-bottom:14px}.o3{grid-template-columns:repeat(3,1fr)}.o2{grid-template-columns:1fr 1fr}
.oc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:11px 8px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;transition:all .2s}
.oc:hover{border-color:var(--teal)}
.oc.sel{border-color:var(--teal);background:var(--tealbg);color:var(--teal-d);box-shadow:inset 0 0 0 1px var(--teal)}
.b2b{display:none;background:var(--bg);border:1.5px solid var(--teal);border-radius:14px;padding:14px;margin-bottom:14px}.b2b.show{display:block;animation:in .25s}
.tp{padding:9px 6px;border:1.5px solid var(--line);border-radius:10px;background:#fff;text-align:center;font-size:12px;cursor:pointer;transition:.2s}
.tp.sel{border-color:var(--teal);background:var(--tealbg);font-weight:700}
.tp b{display:block;font-size:15px;color:var(--teal-d)}
.sum{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12.5px;margin-top:8px}
.hint{background:var(--tealbg);border-inline-start:4px solid var(--teal);border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:14px}
.br{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer;background:#fff;transition:all .2s}
.br:hover{border-color:var(--teal);transform:translateY(-1px)}
.br.sel{border-color:var(--teal);background:var(--tealbg);box-shadow:0 4px 14px rgba(14,124,134,.14)}
.bt2{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;font-weight:700;font-size:13.5px}
.tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--bg);color:var(--mut)}
.tag.fast{background:var(--ambbg);color:#8a5200}
.meta{font-size:12px;color:var(--mut);margin:4px 0 6px}
.bar{height:8px;border-radius:6px;background:#e3e9f0;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--teal);transition:width .4s}.bar i.f{background:var(--amber)}
.sumbox{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;line-height:1.9;font-size:13px}
.cc{border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;cursor:pointer;background:#fff;transition:all .18s}
.cc:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:0 8px 18px rgba(14,124,134,.14)}
.ch{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.dep{background:var(--ambbg);color:#8a5200;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px}
.rp{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:var(--mut)}
.hub{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.ok{font-size:12.5px;color:var(--teal-d);font-weight:600;margin-top:6px}
.tl{list-style:none;margin:14px 0 0;padding:0;border-inline-start:3px solid var(--line);margin-inline-start:8px}
.tl li{position:relative;padding:4px 18px 16px}
.tl li:before{content:"";position:absolute;inset-inline-start:-9.5px;top:8px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--teal)}
.tl li.end:before{background:var(--teal)}.tl li.start:before{border-color:var(--ink)}
.th{display:inline-block;background:var(--ink);color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;margin-bottom:3px}
.tl small{display:block;color:var(--mut);font-size:12px}
.rv{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.avg{background:var(--ink);color:#fff;border-radius:99px;padding:5px 14px;font-size:13px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.stars{display:flex;gap:6px;margin-bottom:10px}
.sb{width:38px;height:38px;margin:0;padding:0;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:#b6c1ce;display:grid;place-items:center}
.sb.on{background:var(--amber);border-color:var(--amber);color:#fff}
.rl{display:grid;gap:10px;grid-template-columns:1fr;margin-top:14px}
@media(min-width:560px){.rl{grid-template-columns:1fr 1fr}}
.rc{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12.5px}
.rt{display:flex;justify-content:space-between;font-weight:700;margin-bottom:4px;color:var(--ink2)}.rt .s{color:var(--amber);display:flex}
.rr{display:inline-block;font-size:11px;color:var(--teal-d);background:#fff;border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-bottom:6px}
.mb{display:none;position:fixed;inset:0;background:rgba(11,31,58,.6);backdrop-filter:blur(3px);z-index:99;align-items:center;justify-content:center;padding:16px}.mb.open{display:flex;animation:in .2s}
.modal{background:#fff;width:100%;max-width:450px;border-radius:18px;padding:22px}
.modal h3{margin:0 0 4px;text-align:center}.modal p{margin:0 0 14px;text-align:center;font-size:12.5px;color:var(--mut)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
<symbol id="flag" viewBox="0 0 24 24"><path d="M5 21V4m0 0h11l-2 4 2 4H5"/></symbol>
<symbol id="truck" viewBox="0 0 24 24"><path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7.5" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></symbol>
<symbol id="swap" viewBox="0 0 24 24"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4m4 4H7"/></symbol>
<symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
<symbol id="bldg" viewBox="0 0 24 24"><path d="M4 21V5l8-2v18M12 9h8v12M7 9h2m-2 4h2m-2 4h2m6-4h2m-2 4h2"/></symbol>
<symbol id="globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
<symbol id="star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol>
<symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="box" viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9zM4 7.5 12 12l8-4.5M12 12v9"/></symbol>
<symbol id="shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></symbol>
<symbol id="bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
<symbol id="route" viewBox="0 0 24 24"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></symbol>
<symbol id="door" viewBox="0 0 24 24"><path d="M6 21V4h12v17M3 21h18M14 12v.01"/></symbol>
</defs></svg>

<div class="nav">
  <div class="brand"><div class="logo"><svg class="i"><use href="#route"/></svg></div>
    <div><div class="bt" data-i="brand"></div><div class="bs" data-i="tag"></div></div></div>
  <div class="acts">
    <button type="button" id="langBtn" class="pill nbtn ghost" onclick="toggleLanguage()"><svg class="i"><use href="#globe"/></svg><span id="langTxt"></span></button>
    <span class="pill"><svg class="i" id="uIcon"><use href="#user"/></svg><span id="uPill"></span></span>
    <button type="button" class="pill nbtn" onclick="openAuth()"><svg class="i"><use href="#shield"/></svg><span data-i="login"></span></button>
  </div>
</div>

<div id="authBd" class="mb" onclick="if(event.target===this)closeAuth()">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 data-i="mTitle"></h3><p data-i="mSub"></p>
    <div class="opt o3">
      <div class="oc sel" id="at-guest" tabindex="0" onclick="authTab('guest')" data-i="guest"></div>
      <div class="oc" id="at-individual" tabindex="0" onclick="authTab('individual')" data-i="indiv"></div>
      <div class="oc" id="at-corporate" tabindex="0" onclick="authTab('corporate')" data-i="corp"></div>
    </div>
    <div class="fg"><label id="aNameL" for="aName"></label><input id="aName" data-ph="aNamePh"></div>
    <div class="fg" id="aExtraG" style="display:none"><label id="aExtraL" for="aExtra"></label><input id="aExtra" data-ph="aExtraPh"></div>
    <button type="button" class="btn" onclick="confirmAuth()"><svg class="i"><use href="#check"/></svg><span data-i="mSave"></span></button>
    <button type="button" class="btn sec" onclick="closeAuth()" data-i="mClose"></button>
  </div>
</div>

<div class="card">
  <h2 data-i="heading"></h2><div class="sub" data-i="subtitle"></div>
  <div class="prog"><div class="ps cur" id="prog1" data-i="p1"></div><div class="ps" id="prog2" data-i="p2"></div><div class="ps" id="prog3" data-i="p3"></div></div>

  <div class="dash" aria-live="polite">
    <div class="dh"><div class="dt"><svg class="i"><use href="#truck"/></svg><span id="bTitle"></span></div><span class="live" data-i="live"></span></div>
    <div class="kpis"><div class="kpi"><b id="kKm"></b><span data-i="kKm"></span></div><div class="kpi"><b id="kHr"></b><span data-i="kHr"></span></div><div class="kpi"><b id="kSt"></b><span data-i="kSt"></span></div></div>
    <div class="hw"><span class="hwc" id="bCode"></span><span id="bName"></span></div>
    <div class="nodes" id="nodes"></div>
  </div>

  <div id="step1" class="step on">
    <div class="badge" data-i="bd1"></div>
    <div class="fg"><div class="lb" data-i="lClient"></div>
      <div class="opt o3">
        <div class="oc" id="c-guest" tabindex="0" onclick="selectClient('guest')"><svg class="i"><use href="#bolt"/></svg><span data-i="guest"></span></div>
        <div class="oc sel" id="c-individual" tabindex="0" onclick="selectClient('individual')"><svg class="i"><use href="#user"/></svg><span data-i="indivPc"></span></div>
        <div class="oc" id="c-corporate" tabindex="0" onclick="selectClient('corporate')"><svg class="i"><use href="#bldg"/></svg><span data-i="corpPc"></span></div>
      </div></div>

    <div id="b2b" class="b2b">
      <div class="lb" data-i="lTiers"></div>
      <div class="opt o3">
        <div class="tp sel" id="t50" onclick="setCount(50)"><span data-i="t50"></span><b data-i="t50p"></b></div>
        <div class="tp" id="t100" onclick="setCount(100)"><span data-i="t100"></span><b data-i="t100p"></b></div>
        <div class="tp" id="t250" onclick="setCount(250)"><span data-i="t250"></span><b data-i="t250p"></b></div>
      </div>
      <label for="cnt" data-i="lCount"></label>
      <input type="number" id="cnt" min="50" max="5000" value="50" oninput="recalcB2B()">
      <div class="sum" id="b2bSum"></div>
    </div>

    <div class="cities">
      <div class="fg"><label for="from"><svg class="i"><use href="#pin"/></svg> <span data-i="lFrom"></span></label><select id="from" onchange="onRoute()"></select></div>
      <button type="button" class="swap" onclick="swapCities()" aria-label="Swap"><svg class="i"><use href="#swap"/></svg></button>
      <div class="fg"><label for="to"><svg class="i"><use href="#flag"/></svg> <span data-i="lTo"></span></label><select id="to" onchange="onRoute()"></select></div>
    </div>

    <div class="fg"><div class="lb" data-i="lSvc"></div>
      <div class="opt o2">
        <div class="oc sel" id="s-hub" tabindex="0" onclick="selectSvc('hub')"><svg class="i"><use href="#pin"/></svg><span data-i="sHub"></span></div>
        <div class="oc" id="s-d2d" tabindex="0" onclick="selectSvc('d2d')"><svg class="i"><use href="#door"/></svg><span data-i="sD2d"></span></div>
        <div class="oc" id="s-d2b" tabindex="0" onclick="selectSvc('d2b')"><svg class="i"><use href="#box"/></svg><span data-i="sD2b"></span></div>
        <div class="oc" id="s-b2b" tabindex="0" onclick="selectSvc('b2b')"><svg class="i"><use href="#bldg"/></svg><span data-i="sB2b"></span></div>
      </div>
      <div class="hint" id="hint"></div></div>

    <div class="fg"><div class="lb" id="brLbl"></div><div id="branches"></div></div>

    <div class="g2">
      <div class="fg"><label for="weight" data-i="lWeight"></label><select id="weight"></select></div>
      <div class="fg"><label for="ready" data-i="lReady"></label><select id="ready"></select></div>
    </div>
    <div class="fg"><label for="notes" data-i="lNotes"></label><textarea id="notes" rows="2" data-ph="notesPh"></textarea></div>
    <button type="button" class="btn" onclick="registerShipment()"><span data-i="next1"></span><svg class="i arr"><use href="#arrow"/></svg></button>
  </div>

  <div id="step2" class="step">
    <div class="badge" data-i="bd2"></div>
    <div class="sumbox" id="shipSum"></div>
    <div id="couriers"></div>
    <button type="button" class="btn sec" onclick="goStep(1)"><svg class="i arr" style="transform:scaleX(-1)"><use href="#arrow"/></svg><span data-i="back1"></span></button>
  </div>

  <div id="step3" class="step">
    <div class="badge" data-i="bd3"></div>
    <div class="sumbox" id="trackBox"></div>
    <button type="button" class="btn sec" onclick="goStep(2)"><span data-i="back2"></span></button>
    <button type="button" class="btn" onclick="goStep(1)"><svg class="i"><use href="#box"/></svg><span data-i="reset"></span></button>
  </div>
</div>

<div class="card">
  <div class="rv"><div><h3 style="margin:0;font-size:18px" data-i="rvH"></h3><span class="sub" style="font-size:12px" data-i="rvS"></span></div>
    <div class="avg"><svg class="i fill"><use href="#star"/></svg><span id="avg"></span></div></div>
  <div class="sumbox">
    <div class="lb" data-i="rvRate"></div>

 const cS=ex(COAST),sS=ex(SOUTH),wS=ex(WEST_ORD),nS=ex(NORTH_ORD);
 if(jj)mid=f==='جازان'?['الدرب','القنفذة','الليث']:['الليث','القنفذة','الدرب'];
 else if(cS)mid=cS.filter(c=>['بيش','الدرب','القنفذة','الليث','جدة','رابغ','ينبع','الوجه','ضباء'].includes(c)).slice(0,4);
 else if(sS)mid=sS.filter(c=>['الدرب','أبها','بيشة','وادي الدواسر','الخرج'].includes(c)).slice(0,4);
 else if(wS)mid=wS.filter(c=>['مكة المكرمة','الطائف','الدوادمي','الرياض','الأحساء (الهفوف)'].includes(c)).slice(0,4);
 else if(nS)mid=nS.filter(c=>['المجمعة','بريدة','حائل','سكاكا (الجوف)'].includes(c)).slice(0,4);
 else{const D=dist(f,t2);if(D>200){const valid=[];
  ['الدرب','القنفذة','الليث','جدة','الطائف','أبها','بيشة','وادي الدواسر','الدوادمي','الرياض','المجمعة','بريدة','حائل','ينبع','المدينة المنورة','الأحساء (الهفوف)'].forEach(h=>{
   if(h===f||h===t2)return;const d1=dist(f,h),d2=dist(h,t2);if(d1+d2<=D*1.24&&d1>75&&d2>75)valid.push({h,d1})});
  valid.sort((a,b)=>a.d1-b.d1);
  if(valid.length===1)mid=[valid[0].h];else if(valid.length===2)mid=[valid[0].h,valid[1].h];
  else if(valid.length>=3)mid=[valid[0].h,valid[Math.floor(valid.length/2)].h,valid[valid.length-1].h]}}
 const chain=[f,...mid,t2],legs=[];let cum=0,km=0;
 chain.forEach((c,i)=>{
  if(!i){legs.push({c,add:0,cum:0,km:0,k:'start'});return}
  const s=dist(chain[i-1],c);km+=s;const h=Math.max(1,Math.round(s/80*2)/2);cum=Math.round((cum+h)*2)/2;
  legs.push({c,add:h,cum,km:s,k:i===chain.length-1?'end':'stop'})});
 if(jj&&legs.length===5){let seg=[[125,1.5],[215,3.5],[170,3],[205,4]];if(f==='جدة')seg=seg.reverse();
  cum=0;km=0;seg.forEach((s,i)=>{cum+=s[1];km+=s[0];Object.assign(legs[i+1],{km:s[0],add:s[1],cum})})}
 return{hw,hrs:cum,km:Math.max(35,km),legs}}
const chainTxt=legs=>legs.map(l=>city(l.c)).join(isEn()?' → ':' ← ');

/* ---------- Icons ---------- */
const ic=(n,c='')=>`<svg class="i ${c}"><use href="#${n}"/></svg>`;

/* ---------- Selects ---------- */
function buildSelects(){
 ['from','to'].forEach(id=>{const el=$(id),cur=el.value||(id==='from'?'جازان':'جدة');
  el.innerHTML=GROUPS.map(g=>`<optgroup label="${t('g_'+g)}">`+CITIES.filter(c=>c[2]===g).map(c=>`<option value="${c[0]}">${isEn()?c[1]:c[0]}</option>`).join('')+'</optgroup>').join('');
  el.value=cur});
 [['weight','w'],['ready','r']].forEach(([id,p])=>{const el=$(id),cur=el.value||(id==='weight'?'1':'0');
  el.innerHTML=[0,1,2,3].map(i=>`<option value="${i}">${t(p+i)}</option>`).join('');el.value=cur})}
function swapCities(){const a=$('from'),b=$('to'),v=a.value;a.value=b.value;b.value=v;onRoute()}

/* ---------- Banner & branches ---------- */
function onRoute(){
 const f=$('from').value,to=$('to').value,r=buildRoute(f,to),hw=HW[r.hw];
 $('bTitle').textContent=t('active')+': '+chainTxt(r.legs);
 $('kKm').textContent=num(r.km);$('kHr').textContent=num(r.hrs);$('kSt').textContent=num(r.legs.length);
 $('bCode').textContent=hw.code[lang];$('bName').textContent=hw.name[lang];
 $('nodes').innerHTML=r.legs.map((l,i)=>`<div class="node ${i===r.legs.length-1?'end':''}"><div class="dot">${ic(i===0?'pin':i===r.legs.length-1?'flag':'truck')}</div><div class="nc">${city(l.c)}</div><div class="nh">${i===0?'0 '+t('h'):'+'+num(l.add)+' '+t('h')+' ('+num(l.cum)+')'}</div></div>`).join('');
 renderBranches()}
function renderBranches(){
 const f=$('from').value;
 $('branches').innerHTML=BR.map((b,i)=>{const p=b.load,rem=100-p;
  return `<div class="br ${i===bIdx?'sel':''}" tabindex="0" onclick="selectBranch(${i})" onkeydown="if(event.key==='Enter')selectBranch(${i})">
  <div class="bt2"><span>${ic(i===0?'bolt':'bldg')} ${t('b'+i)} (${city(f)})</span><span class="tag ${i===0?'fast':''}">${i===0?t('next'):t('loading')}</span></div>
  <div class="meta">${t('occ',{p,r:rem})}<br>${t('bMeta',{h:b.eta})}</div>
  <div class="bar"><i class="${i===0?'f':''}" style="width:${p}%"></i></div></div>`}).join('')}
function selectBranch(i){bIdx=i;renderBranches()}

/* ---------- Selection UI ---------- */
function selectSvc(k){svc=k;['hub','d2d','d2b','b2b'].forEach(x=>$('s-'+x).classList.toggle('sel',x===k));updateSvcText()}
function updateSvcText(){$('hint').innerHTML=t('hint_'+svc);$('brLbl').textContent=t('brLbl_'+svc)}
function selectClient(k){ctype=k;['guest','individual','corporate'].forEach(x=>$('c-'+x).classList.toggle('sel',x===k));
 $('b2b').classList.toggle('show',k==='corporate');if(k==='corporate')recalcB2B();else count=1;updatePill()}
function updatePill(){
 const n=uname,m={guest:['bolt',t('guestPill')],individual:['user',t('indivPill')+(n?': '+n:'')],corporate:['bldg',t('corpPill')+(n?': '+n:'')]}[ctype];
 $('uPill').textContent=m[1];$('uIcon').innerHTML=`<use href="#${m[0]}"/>`}
const unitB2B=n=>n>=250?22:n>=100?26:29;
function setCount(v){$('cnt').value=v;recalcB2B()}
function recalcB2B(){
 const raw=parseInt($('cnt').value,10)||50,n=Math.max(50,raw);count=n;
 const u=unitB2B(n),tot=n*u,save=n*38-tot;
 ['50','100','250'].forEach(x=>$('t'+x).classList.remove('sel'));$('t'+(n>=250?'250':n>=100?'100':'50')).classList.add('sel');
 $('b2bSum').innerHTML=`<span>${t('unit')}: <b>${u} ${t('sar')}</b> ${raw<50?t('minNote'):''}</span><span>${t('total',{n:num(n)})}: <b>${num(tot)} ${t('sar')}</b></span><span style="color:var(--teal-d);font-weight:700">${t('saved')} ${num(save)} ${t('sar')}</span>`}

/* ---------- Auth ---------- */
function openAuth(){$('authBd').classList.add('open');authTab(role)}
function closeAuth(){$('authBd').classList.remove('open')}
function authTab(r){role=r;['guest','individual','corporate'].forEach(x=>$('at-'+x).classList.toggle('sel',x===r));
 $('aNameL').textContent=t(r==='guest'?'aNameG':r==='individual'?'aNameI':'aNameC');
 $('aExtraG').style.display=r==='guest'?'none':'block';
 $('aExtraL').textContent=t(r==='corporate'?'aExtraC':'aExtraI')}
function confirmAuth(){const v=$('aName').value.trim();
 uname=v||(role==='corporate'?t('dfltCorp'):role==='individual'?t('dfltInd'):'');
 if(role==='guest')uname='';selectClient(role);closeAuth()}

/* ---------- Language ---------- */
function applyText(){
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
 $('langTxt').textContent=isEn()?'العربية':'English';
 document.title=isEn()?'Masarak Smart Logistics':'مسارك الذكية للشحن | Masarak';
 const m=['bd1','bd2','bd3'];}
function toggleLanguage(){
 lang=isEn()?'ar':'en';const r=$('htmlRoot');r.lang=lang;r.dir=isEn()?'ltr':'rtl';
 applyText();buildSelects();updateSvcText();updatePill();authTab(role);recalcB2B();onRoute();renderReviews();
 if($('step2').classList.contains('on'))loadSchedule();
 if($('step3').classList.contains('on')&&ship)goTrack(ship.cIdx)}

/* ---------- Steps ---------- */
function goStep(n){[1,2,3].forEach(i=>{$('step'+i).classList.toggle('on',i===n);
 $('prog'+i).classList.toggle('cur',i===n);$('prog'+i).classList.toggle('done',i<n)});window.scrollTo({top:0,behavior:'smooth'})}
function registerShipment(){
 const f=$('from').value,to=$('to').value;
 count=ctype==='corporate'?Math.max(50,parseInt($('cnt').value,10)||50):1;
 if(ctype==='corporate')$('cnt').value=count;
 ship={id:'MSK-'+Math.floor(100000+Math.random()*900000),ctype,count,svc,from:f,to,bi:bIdx,w:+$('weight').value,r:+$('ready').value,notes:$('notes').value.trim(),route:buildRoute(f,to),cIdx:0};
 loadSchedule();goStep(2)}

function loadSchedule(){
 const s=ship,b=BR[s.bi],hw=HW[s.route.hw],ch=chainTxt(s.route.legs),after=Math.min(100,b.load+s.count);
 const wait=after>=100?0.5:b.eta,bn=`${t('b'+s.bi)} (${city(s.from)})`;
 $('shipSum').innerHTML=`${t('shipId')}: <b>${s.id}</b> | ${t('qty')}: <b>${num(s.count)} ${t('parc')}</b><br>
 ${t('origin')}: <b style="color:var(--teal-d)">${bn}</b> (${t('occB')}: <b>${b.load}%</b> → <b>${after}%</b> ${t('after')})<br>
 ${t('hwL')}: <b>${hw.code[lang]}</b> — ${hw.name[lang]}<br>
 ${t('stopsL')} (${num(s.route.km)} ${t('km')}): <b>${ch}</b> | ${t('roadT')}: <b>${num(s.route.hrs)} ${t('hrs')}</b>`;
 const mult=s.svc==='d2d'?1.25:s.svc==='b2b'?0.85:s.svc==='hub'?0.95:1,add=Math.min(12,Math.floor(s.route.km/250)*3),bu=unitB2B(s.count);
 const base=[
  {n:{ar:'مسارك إكسبريس (سمسا: الخط السريع المباشر)',en:'Masarak Express (SMSA Direct Line)'},ip:35,cp:bu,sf:1.0,rt:'4.9'},
  {n:{ar:'درة اللوجستية (أرامكس: خط المحافظات)',en:'Durrah Logistics (Aramex Regional Line)'},ip:31,cp:Math.max(20,bu-2),sf:1.15,rt:'4.7'},
  {n:{ar:'الناقل الوطني الموحد (سبل)',en:'National Unified Carrier (SPL)'},ip:24,cp:Math.max(18,bu-4),sf:1.3,rt:'4.6'}];
 cour=base.map(c=>{
  const corp=s.ctype==='corporate',unit=corp?c.cp:Math.round((c.ip+add)*mult),tot=unit*s.count;
  const rh=Math.max(1.5,Math.round(s.route.hrs*c.sf*2)/2),te=Math.round((rh+wait)*2)/2;
  return{n:c.n,unit,tot,corp,sf:c.sf,rt:c.rt,rh,wait,te,after,
   dep:after>=100?t('full'):t('dep',{p:after,h:b.eta})}});
 $('couriers').innerHTML=`<div class="lb">${t('chooseC')}</div>`+cour.map((c,i)=>{
  const cost=c.corp?`${c.unit} ${t('sar')}/${isEn()?'parcel':'طرد'} (${num(c.tot)} ${t('sar')})`:`${c.unit} ${t('sar')}`;
  const wt=c.wait===0.5?t('immed'):`${num(c.wait)} ${t('h')} ${t('wait')}`;
  return `<div class="cc" tabindex="0" onclick="goTrack(${i})" onkeydown="if(event.key==='Enter')goTrack(${i})">
  <div class="ch"><b>${ic('truck')} ${c.n[lang]}</b><span class="dep">${c.dep}</span></div>
  ${t('cost')}: <b style="color:var(--teal-d)">${cost}</b> | <span style="color:var(--amber)">${ic('star','fill')}</span> ${c.rt}<br>
  ${t('totalT')}: <b>${num(c.rh)} ${t('h')} ${t('road')} + ${wt} = ${num(c.te)} ${t('hrs')} ${t('total2')}</b>
  <div class="rp">${ch} | ${t('truckOcc')}: <b>${c.after}%</b><div class="bar" style="margin-top:5px"><i class="${c.after>=95?'f':''}" style="width:${c.after}%"></i></div></div></div>`}).join('')}

function goTrack(ci){
 ship.cIdx=ci;const s=ship,c=cour[ci],legs=s.route.legs,hw=HW[s.route.hw],bn=`${t('b'+s.bi)} (${city(s.from)})`;
 let run=0;
 const items=legs.map((l,i)=>{
  if(i===0)return `<li class="start"><span class="th">${t('hour0')}</span><b>${city(l.c)}</b><small>${bn} — ${c.dep}</small></li>`;
  const h=Math.max(1,Math.round(l.add*c.sf*2)/2);run=Math.round((run+h)*2)/2;
  const tag=`+${num(h)} ${t('h')} (${num(l.km)} ${t('km')}) | ${t('cum')}: ${num(run)} ${t('hrs')}`;
  if(i===legs.length-1)return `<li class="end"><span class="th">${tag}</span><b>${city(l.c)}</b><small>${s.svc==='d2d'?t('n_endD'):t('n_endH')}</small></li>`;
  return `<li><span class="th">${tag}</span><b>${t('stopAt')} ${city(l.c)}</b><small>${t('n_stop')}</small></li>`}).join('');
 const d=city(s.to),d2=s.svc==='d2d';
 const opts=d2?[t('hD0'),t('hD1')]:[t('hN')+' ('+d+')',t('hM')+' ('+d+')',t('hS')+' ('+d+')'];
 const cost=c.corp?`${c.unit} ${t('sar')}/${isEn()?'parcel':'طرد'} (${num(c.tot)} ${t('sar')})`:`${c.unit} ${t('sar')}`;
 window._run=run;
 $('trackBox').innerHTML=`${t('shipId')}: <b>${s.id}</b> | ${t('carrier')}: <b>${c.n[lang]}</b><br>
 ${t('appr')}: <b style="color:var(--teal-d)">${cost}</b><br>${t('hwL')}: <b>${hw.code[lang]}</b> — ${hw.name[lang]}<br>
 ${t('depL')}: <b style="color:var(--amber)">${bn} — ${c.dep}</b>
 <div class="hub"><label for="hubSel">${d2?t('hubFinal',{c:d}):t('hubPick',{c:d})}</label>
 <select id="hubSel" onchange="hubNote()">${opts.map((o,i)=>`<option value="${i}">${o}</option>`).join('')}</select>
 <div class="ok" id="hubMsg">${ic('check')} ${d2?t('hOkD',{h:num(run)}):t('hOkH',{c:d,h:num(run)})}</div></div>
 <div class="lb" style="margin-top:14px">${ic('route')} ${t('schedL')}</div><ol class="tl">${items}</ol>`;
 goStep(3)}
function hubNote(){const sel=$('hubSel');$('hubMsg').innerHTML=ic('check')+' '+t('hConf')+sel.options[sel.selectedIndex].text}

/* ---------- Reviews ---------- */
function drawStars(){$('stars').innerHTML=[1,2,3,4,5].map(n=>`<button type="button" class="sb ${n<=stars?'on':''}" onclick="setStars(${n})" aria-label="${n}">${ic('star','fill')}</button>`).join('')}
function setStars(n){stars=n;drawStars()}
function renderReviews(){
 const all=[...userReviews,...REVIEWS];
 $('avg').textContent='4.9 / 5.0 ('+t('rvCount',{n:num(126+all.length)})+')';
 $('reviews').innerHTML=all.map(r=>{const nm=typeof r.n==='string'?r.n:r.n[lang],cm=typeof r.c==='string'?r.c:r.c[lang];
  return `<div class="rc"><div class="rt"><span>${nm}</span><span class="s">${Array.from({length:r.s},()=>ic('star','fill')).join('')}</span></div>
  <div class="rr">${city(r.f)} ${isEn()?'→':'←'} ${city(r.to)} (${HW[hwOf(r.f,r.to)].code[lang]})</div><div>${cm}</div></div>`}).join('')}
function submitReview(){
 const n=$('rvName').value.trim()||uname||t('nameDef'),c=$('rvText').value.trim()||t('cmtDef');
 userReviews.unshift({n,c,s:stars,f:$('from').value,to:$('to').value});
 $('rvName').value='';$('rvText').value='';renderReviews()}

/* ---------- Init ---------- */
window.addEventListener('DOMContentLoaded',()=>{
 applyText();buildSelects();updateSvcText();updatePill();authTab('guest');drawStars();recalcB2B();onRoute();renderReviews()});
</script>
</body>
</html>
