const HWN=[['طريق 5 (الساحل)','Highway 5 (Coastal)'],['طريق 10 / 30','Highway 10 / 30'],['طريق 40','Highway 40'],['طريق 65 / 85','Highway 65 / 85'],['طريق 15 / الشبكة الوطنية','Highway 15 / National network']];
function dist(a,b){const g=CM[a],h=CM[b],r=Math.PI/180,dl=(h.lat-g.lat)*r,dn=(h.lon-g.lon)*r,x=Math.sin(dl/2)**2+Math.cos(g.lat*r)*Math.cos(h.lat*r)*Math.sin(dn/2)**2;return Math.max(25,Math.round(6371*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))*1.28))}
const hwIdx=(f,t2)=>{const i=CORR.findIndex(a=>a.includes(f)&&a.includes(t2));return i<0?4:i};

/* matching engine: trip covers parcel segment in the same direction on a shared corridor */
function covers(trip,f,t2){
 if(trip.from===f&&trip.to===t2)return true;
 return CORR.some(a=>{const i=a.indexOf(trip.from),j=a.indexOf(trip.to),p=a.indexOf(f),q=a.indexOf(t2);
  if([i,j,p,q].some(x=>x<0)||i===j||p===q)return false;
  if(Math.sign(j-i)!==Math.sign(q-p))return false;
  const lo=Math.min(i,j),hi=Math.max(i,j);return p>=lo&&p<=hi&&q>=lo&&q<=hi})}
const bcSVG=code=>{let b=[2,1,1,2,3,1];for(const ch of code){const c=ch.charCodeAt(0);b.push((c%3)+1,((c>>2)%2)+1,((c>>3)%3)+1,((c>>5)%2)+1)}b.push(3,1,1,2,1,2);let x=8,r='';b.forEach((v,i)=>{const w=v*1.9;if(i%2===0)r+=`<rect x="${x.toFixed(1)}" y="4" width="${w.toFixed(1)}" height="46" fill="#0b1f3a"/>`;x+=w});return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${Math.ceil(x+8)} 54" height="54">${r}</svg>`};

 const getNodes = (f, t2) => {
  let r = [f, t2];
  CORR.forEach(a => {
    let i = a.indexOf(f), j = a.indexOf(t2);
    if (i >= 0 && j >= 0 && i !== j) {
      r = []; let s = i < j ? 1 : -1;
      for (let k = i; k !== j + s; k += s) r.push(a[k]);
    }
  });
  // إذا كانت المدن أكثر من 5، نختصرها بنقاط (...) عشان ما يتشوه التصميم في شاشة الجوال
  if (r.length > 5) r = [r[0], r[1], '...', r[r.length-2], r[r.length-1]];
  return r.map((c, idx, arr) => `<span style="font-size:11.5px;text-align:center;line-height:1.2">${esc(c === '...' ? '...' : city(c))}</span>${idx < arr.length - 1 ? '<i></i>' : ''}`).join('');
};

function findOffers(){
 if(!F.rname.trim()||!/^05\d{8}$/.test(F.rphone.trim())){msg=t('errReq');draw();return}
 msg='';
 
 // 1. حساب عدد المحطات البينية لمعرفة حجم التحميل والتنزيل
 const km=dist(F.from,F.to);
 let path = [];
 CORR.forEach(a => {
   let i = a.indexOf(F.from), j = a.indexOf(F.to);
   if(i>=0 && j>=0 && i!==j) {
     let s = i<j ? 1 : -1;
     for(let k=i; k!==j+s; k+=s) path.push(a[k]);
   }
 });
 // نحذف نقطة الانطلاق والوجهة عشان تصفى لنا المحطات اللي في النص بس
 let stops = Math.max(0, path.length - 2); 
 
 // 2. الزمن الكلي = وقت الطريق + (نصف ساعة لكل محطة يتوقف فيها للتحميل)
 const rh = road(km) + (stops * 0.5); 
 
 // 3. رفع معامل التسعير لخدمة "من الباب للباب" (d2d صارت 1.6 بدل 1.25)
 const base=Math.round(18+km*.035)*(U.role==='corporate'?.8:1),kgm=1+(+F.kg>5?.25:0);
 const sv={hub:.95,d2d:1.6,d2b:1.1,b2b:.85}[F.svc];
 
 let L=[[t('car'),1.3,1,5],[t('car2'),1.1,1.15,7],[t('car3'),.9,1.3,9]].map(c=>({type:'car',name:c[0],price:Math.round(base*c[1]*kgm*sv),wait:c[3],hrs:Math.round((rh*c[2]+c[3])*2)/2}));
 const cheapest=Math.min(...L.map(o=>o.price));
 
 trips.filter(x=>x.left>=+F.kg&&x.ts>Date.now()-36e5&&covers(x,F.from,F.to)).forEach(x=>{
  const w=Math.max(0,Math.round((x.ts-Date.now())/36e5*2)/2);
  
  // 4. تسعير المسافر الذكي (تطبيق فكرتك)
  let trvPrice = Math.max(12, Math.round(cheapest*.55)); // السعر الأساسي الرخيص لنقاط الاستلام
  
  // إذا اختار العميل "من الباب للباب" نضيف 45 ريال فورية كعلاوة توصيل للمسافر عشان زحمة الأحياء
  if(F.svc === 'd2d') {
      trvPrice += 45; 
  }
  
  L.push({type:'trv',name:`${esc(x.name)}`,price:trvPrice,wait:w,hrs:Math.round((km/90+w)*2)/2,trip:x})});
  
 const mh=Math.min(...L.map(o=>o.hrs)),mp=Math.min(...L.map(o=>o.price));
 L.forEach(o=>{o.fast=o.hrs===mh;o.cheap=o.price===mp});L.sort((a,b)=>(a.type==='trv'?0:1)-(b.type==='trv'?0:1)||a.hrs-b.hrs);
 offers=L;stage=2;draw()}
function chooseOffer(i){

 if(U.role==='corporate'){if(wallet()<o.price){msg=t('lowBal');draw();return}setWallet(wallet()-o.price);addTx(t('dShip'),o.price)}
 const p={id:'MSK-'+Date.now().toString().slice(-6)+Math.floor(10+Math.random()*89),owner:U.phone,ownerName:U.name,from:F.from,to:F.to,kg:+F.kg,rname:F.rname,rphone:F.rphone,notes:F.notes,price:o.price,type:o.type,hrs:o.hrs,tripId:o.trip?o.trip.id:null,carrier:o.type==='car'?o.name:null,status:o.type==='trv'?'pending':'booked',by:null,ts:Date.now()};
 parcels.unshift(p);save();cur=p;stage=3;msg='';draw()}

 const mine=trips.filter(x=>x.phone===U.phone);
 return `<div class="sb"><h3>${t('tripT')}</h3><p class="sub" style="margin-bottom:12px">${t('tripS')}</p>
 <div class="cities">${cityPick(TF,'TF','from',t('from'))}<button class="swap" aria-label="swap" onclick="const x=TF.from;TF.from=TF.to;TF.to=x;draw()">${ic('swap')}</button>${cityPick(TF,'TF','to',t('to'))}</div>
<div class="g2">
  <div class="fg">
    <label>${lang==='en'?'Available Space (AI Camera)':'مساحة الصندوق (كاميرا ذكية)'}</label>
    <div style="display:flex;gap:8px">
      <input type="text" id="aiSpace" placeholder="مثال: 120x90 سم" value="${TF.space||''}" oninput="TF.space=this.value" style="flex:1">
      <button class="btn dk sm" onclick="simulateTrunkAI()" style="width:auto">📷</button>
    </div>
  </div>
  <div class="fg"><label>${t('depIn')}</label><select onchange="TF.dep=this.value">${[[1,'in1'],[3,'in3'],[6,'in6'],[24,'in24']].map(o=>`<option value="${o[0]}" ${TF.dep==o[0]?'selected':''}>${t(o[1])}</option>`).join('')}</select></div>
</div>
<div class="fg" style="margin-bottom:14px">
  <label>${lang==='en'?'Accepted Delivery Service':'نوع خدمة التوصيل المدعومة لرحلتك'}</label>
  <select onchange="TF.svc=this.value">
    <option value="hub" ${TF.svc==='hub'?'selected':''}>${t('s_hub')} (أسرع، لا يتطلب تفرغك للحواري)</option>
    <option value="d2b" ${TF.svc==='d2b'?'selected':''}>من الباب إلى فرع الوجهة</option>
    <option value="d2d" ${TF.svc==='d2d'?'selected':''}>${t('s_d2d')} (يتطلب وقت أطول، بعلاوة مالية مجزية)</option>
  </select>
</div>
 <div class="msg o ${msg?'show':''}">${msg}</div><button class="btn" onclick="postTrip()">${ic('check')} ${t('postBtn')}</button></div>
 <h3>${t('myTrips')}</h3>${mine.length?mine.map(x=>`<div class="row"><div>${ic('car')} <b>${esc(city(x.from))} ${lang==='en'?'→':'←'} ${esc(city(x.to))}</b><br><small style="color:var(--mut)">${t('dep')} ${Math.max(0,Math.round((x.ts-Date.now())/36e5))} ${t('h')} | ${t('left')}: ${x.left}/${x.space} kg</small></div><span class="vb">${ic('shield')} ${t('idv')}</span></div>`).join(''):`<div class="hint">${t('noTrips')}</div>`}`}
function postTrip(){
 if(TF.from===TF.to)return;
 // استخراج الرقم من النص المكتوب عشان المطابقة، وإذا ما لقى رقم يعتبرها 50 كجم افتراضياً
 let cap = parseInt(String(TF.space).match(/\d+/)) || 50; 
 trips.push({id:'T-'+Date.now().toString().slice(-6),name:U.name,phone:U.phone,from:TF.from,to:TF.to,space:cap,left:cap,volText:TF.space,svc:TF.svc||'hub',ts:Date.now()+(+TF.dep)*36e5,veh:U.veh||'v_sedan',rating:5.0,verified:true});
 save();msg=t('posted');draw();msg=''}
function boardList(){const my=trips.filter(x=>x.phone===U.phone);return parcels.filter(p=>p.status==='pending'&&my.some(x=>x.left>=p.kg&&covers(x,p.from,p.to)))}
function boardView(){const l=boardList();return `<h3>${t('boardT')}</h3>`+(l.length?l.map(p=>`<div class="row"><div><b>${esc(city(p.from))} ${lang==='en'?'→':'←'} ${esc(city(p.to))}</b> | ${p.kg} ${lang==='en'?'kg':'كجم'}<br><small style="color:var(--mut)">${p.id} | ${esc(p.rname)}</small></div><div><span class="price">${num(Math.round(p.price*.85))} ${t('sar')}</span> <button class="btn sm ok" onclick="verifyFaceAndAccept('${p.id}')">${t('accept')}</button></div></div>`).join(''):`<div class="hint">${t('noBoard')}</div>`)}
//محاكاة بصمه الوجة
 function verifyFaceAndAccept(id) {
  const msg1 = lang === 'en' ? "Initializing Face ID / Nafath verification..." : "🔒 التحقق الأمني: جاري فتح الكاميرا لمطابقة بصمة الوجه مع الهوية الوطنية (نفاذ)...";
  const msg2 = lang === 'en' ? "Face verified successfully! Parcel assigned to you." : "✅ تمت المطابقة بنجاح! تم ربط عهدة الطرد بحسابك الموثق.";
  alert(msg1);
  setTimeout(() => {
    alert(msg2);
    acceptP(id);
  }, 1500);
}
 
 function acceptP(id){const p=parcels.find(x=>x.id===id),tr=trips.filter(x=>x.phone===U.phone&&x.left>=p.kg&&covers(x,p.from,p.to))[0];if(!tr)return;tr.left-=p.kg;p.status='accepted';p.by=U.phone;p.tripId=tr.id;save();draw()}
function deliverP(id){const p=parcels.find(x=>x.id===id);p.status='delivered';save();draw()}
function earnView(){const l=parcels.filter(p=>p.by===U.phone),sum=s=>l.filter(p=>p.status===s).reduce((a,p)=>a+Math.round(p.price*.85),0);
 return `<div class="stat"><div><b>${num(sum('delivered'))}</b><span>${t('eTot')} (${t('sar')})</span></div><div><b>${num(sum('accepted'))}</b><span>${t('ePen')} (${t('sar')})</span></div><div><b>${l.filter(p=>p.status==='delivered').length}</b><span>${t('eCnt')}</span></div><div><b><span class="vb">${ic('shield')}</span></b><span>${t('idv')}</span></div></div>
 <div class="hint">${t('eFee')} | ${t('bank')}: <b dir="ltr">${esc((U.iban||'').replace(/\s/g,'').replace(/^(.{4}).*(.{4})$/,'$1 •••• $2'))}</b></div>
 ${l.map(p=>`<div class="row"><div><b>${p.id}</b> — ${esc(city(p.from))} ${lang==='en'?'→':'←'} ${esc(city(p.to))}<br><small style="color:var(--mut)">${esc(p.rname)} | ${t('earn')}: ${num(Math.round(p.price*.85))} ${t('sar')}</small></div><div><span class="tg ${stCls(p.status)}">${stTxt(p.status)}</span> ${p.status==='accepted'?`<button class="btn sm" onclick="deliverP('${p.id}')">${t('deliver')}</button>`:''}</div></div>`).join('')}`}

/* ---------- Corporate: bulk + billing ---------- */
const tier=n=>n>=250?22:n>=100?26:29;
function parseCSV(txt){
 const lines=txt.replace(/^\uFEFF/,'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean),rows=[];
 lines.forEach((l,i)=>{const c=l.split(/[,;\t]/).map(x=>x.trim().replace(/^"|"$/g,''));if(i===0&&!/\d{5}/.test(c[1]||''))return;
  if(c[0]&&/^05\d{8}$/.test(c[1]||'')){let ct=CM[c[2]]?c[2]:(CITIES.find(x=>x[1].toLowerCase()===(c[2]||'').toLowerCase())||[])[0]||F.to;rows.push({n:c[0],p:c[1],c:ct,w:+c[3]||1})}});return rows}
function onFile(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{B.rows=parseCSV(String(r.result));B.done=false;msg=B.rows.length?'':t('badFile');draw()};r.readAsText(f)}
function demoRows(){const ct=['جدة','مكة المكرمة','الطائف','الليث','القنفذة'];B.rows=Array.from({length:50},(_,i)=>({n:(lang==='en'?'Recipient ':'مستلم ')+(i+1),p:'05'+String(10000000+Math.floor(Math.random()*89999999)),c:ct[i%5],w:1+(i%3)}));B.done=false;msg='';draw()}
function sampleCSV(){const b=new Blob(['\uFEFFname,phone,city,weight\nMohammed,0501234567,جدة,2\nSara,0559876543,الطائف,1\n'],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='masarak-sample.csv';a.click()}
function bulkView(){
 const n=B.rows.length,u=tier(n),tot=n*u;
 return `<div class="sb"><h3>${t('bulkT')}</h3><p class="sub" style="margin-bottom:12px">${t('bulkS')}</p>
 <div class="up">${ic('up')}<div style="margin:6px 0">${t('drop')}</div><input type="file" accept=".csv,.txt" onchange="onFile(event)"></div>
 <div class="g2"><button class="btn sec" onclick="sampleCSV()">${t('sample')}</button><button class="btn sec" onclick="demoRows()">${t('demo50')}</button></div>
 <div class="msg e ${msg?'show':''}">${msg}</div></div>
 ${n?`<div class="stat"><div><b>${num(n)}</b><span>${t('rows')}</span></div><div><b>${u} ${t('sar')}</b><span>${t('unit')}</span></div><div><b>${num(tot)} ${t('sar')}</b><span>${t('tot')}</span></div><div><b>${num(wallet())}</b><span>${t('wal')}</span></div></div>
 <div class="wrap"><table class="tbl"><tr><th>#</th><th>${t('rname')}</th><th>${t('phone')}</th><th>${t('to')}</th><th>${t('kg')}</th></tr>${B.rows.slice(0,6).map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.n)}</td><td dir="ltr">${esc(r.p)}</td><td>${esc(city(r.c))}</td><td>${r.w}</td></tr>`).join('')}</table></div><small style="color:var(--mut)">${t('prev')}</small>
 ${B.done?`<div class="msg o show">${t('issued')}</div><button class="btn dk" onclick="printWB(B.issued)">${ic('print')} ${t('printAll')} (${num(B.issued.length)})</button>`:`<button class="btn" style="margin-top:12px" onclick="issueBulk()">${ic('check')} ${t('issue')}</button>`}`:''}`}
function issueBulk(){
 const n=B.rows.length,tot=n*tier(n);if(wallet()<tot){msg=t('lowBal');draw();return}
 setWallet(wallet()-tot);addTx(`${t('dBulk')} (${n})`,tot);msg='';
 B.issued=B.rows.map((r,i)=>({id:'MSK-B'+Date.now().toString().slice(-5)+String(i+1).padStart(3,'0'),owner:U.phone,ownerName:U.company||U.name,from:F.from,to:r.c,kg:r.w,rname:r.n,rphone:r.p,notes:'',price:tier(n),type:'car',carrier:t('car'),hrs:0,status:'booked',ts:Date.now()}));
 parcels=B.issued.concat(parcels);save();B.done=true;draw()}
function billView(){
 const l=txs(),sp=l.reduce((a,x)=>a+x.a,0),cnt=parcels.filter(p=>p.owner===U.phone).length;
 return `<div class="hint">${esc(U.company)} | ${t('crL')}: ${esc(U.cr)} | ${t('vatN')}: ${esc(U.vat)}</div>
 <div class="stat"><div><b>${num(wallet())}</b><span>${t('wal')} (${t('sar')})</span></div><div><b>${num(sp)}</b><span>${t('spend')} (${t('sar')})</span></div><div><b>${num(Math.round(sp*15/115))}</b><span>${t('vatL')}</span></div><div><b>${num(cnt)}</b><span>${t('shipC')}</span></div></div>
 <button class="btn sm" style="margin-bottom:14px" onclick="setWallet(wallet()+1000);addTx('+ ${t('wal')}',0);draw()">${ic('wallet')} ${t('top')}</button>
 <h3>${t('inv')}</h3>${l.length?`<div class="wrap"><table class="tbl"><tr><th>${t('date')}</th><th>${t('desc')}</th><th>${t('amt')}</th></tr>${l.map(x=>`<tr><td>${x.d}</td><td>${esc(x.n)}</td><td>${num(x.a)} ${t('sar')}</td></tr>`).join('')}</table></div>`:`<div class="hint">${t('noInv')}</div>`}`}

/* ---------- Print waybills ---------- */
function printWB(list){
 const w=window.open('','_blank','width=840,height=900');if(!w)return window.print();
 w.document.write(`<!DOCTYPE html><html lang="${lang}" dir="${lang==='en'?'ltr':'rtl'}"><head><meta charset="UTF-8"><title>Waybills</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;margin:0;padding:18px;color:#0b1f3a}.wb{border:2px solid #0b1f3a;border-radius:14px;padding:16px;margin-bottom:18px;page-break-inside:avoid}.wbh{display:flex;justify-content:space-between;border-bottom:2px solid #0b1f3a;padding-bottom:8px;margin-bottom:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bc{text-align:center;border:1.5px dashed #16355c;border-radius:10px;padding:10px;margin-top:10px}.bc svg{max-width:100%;height:54px}.bc div{font-family:monospace;font-weight:700;letter-spacing:2px}.tg,.i{display:none}</style></head><body>${list.map(p=>wbView(p,true)).join('')}<script>onload=()=>setTimeout(()=>print(),400)<\/script></body></html>`);w.document.close()}

/* ---------- Shell ---------- */
 function toggleLang() { 
  lang = lang === 'ar' ? 'en' : 'ar'; 
  draw(); 
}
function appView(){
 const tb=tabsFor(U.role),m={ship:()=>shipView(),mine:mineView,bulk:bulkView,bill:billView,post:postView,board:boardView,earn:earnView};
 const rb=U.role==='traveler'?`<span class="vb" style="background:rgba(255,255,255,.12);color:#7fe0c3">${ic('shield')} ${t('idv')}</span>`:'';
 return `<div class="card fade"><div class="tabs" role="tablist">${tb.map(x=>`<button class="tab ${tab===x?'on':''}" onclick="tab='${x}';stage=1;msg='';draw()">${t('t_'+x)}</button>`).join('')}</div>${m[tab]()}</div>`}
function draw(){
 const r=$('htmlRoot');r.lang=lang;r.dir=lang==='en'?'ltr':'rtl';document.title=t('brand')+' | Masarak';
 const nav=`<div class="nav"><div class="brand"><div class="logo">${ic('route')}</div>${t('brand')}</div><div class="acts">
 <button class="pill" onclick="toggleLang()">${ic('globe')} ${t('lg')}</button>
 ${U?`<span class="pill">${ic(U.role==='corporate'?'bldg':U.role==='traveler'?'car':'user')} ${esc(U.name)} — ${t('r_'+U.role)}</span><button class="pill" onclick="logout()">${t('out')}</button>`:''}</div></div>`;
 $('root').innerHTML=nav+(U?appView():authView());
}
window.addEventListener('DOMContentLoaded', () => {
    draw();
});
</script>
