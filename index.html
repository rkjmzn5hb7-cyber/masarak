<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة مسارك الذكية للشحن</title>
    <style>
        :root {
            --primary-orange: #ea580c;
            --container-bg: #ffedd5;
            --page-bg: #fed7aa;
            --dark-orange: #9a3412;
            --white: #ffffff;
            --text-dark: #292524;
        }

       body {
            font-family: Tahoma, sans-serif;
            background-color: var(--page-bg);
            margin: 0;
            padding: 20px;
            direction: rtl;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;             /* <--- هذا السطر */
            align-items: center;       /* <--- وهذا السطر */
            justify-content: center;   /* <--- وهذا السطر */
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 30px auto;
            background: var(--container-bg);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(154, 52, 18, 0.15);
            border: 2px solid #fb923c;
            box-sizing: border-box;
        }

        h2 {
            color: var(--dark-orange);
            text-align: center;
            margin-bottom: 5px;
            font-size: 24px;
        }

        .subtitle {
            text-align: center;
            color: #7c2d12;
            font-size: 13px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .step-box { display: none; }
        .active { display: block; animation: fadeIn 0.3s ease-in-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: var(--dark-orange);
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 2px solid #fb923c;
            border-radius: 10px;
            font-size: 14px;
            background-color: var(--white);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-orange);
            box-shadow: 0 0 8px rgba(234, 88, 12, 0.3);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 480px) {
            .grid-2 {
                grid-template-columns: 1fr 1fr;
            }
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--primary-orange);
            color: var(--white);
            border: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(154, 52, 18, 0.2);
            margin-top: 10px;
        }

        button:active {
            background: var(--dark-orange);
            transform: scale(0.98);
        }

        .secondary-btn {
            background: var(--white);
            color: var(--primary-orange);
            border: 2px solid var(--primary-orange);
            box-shadow: none;
        }

        .service-type-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .service-card {
            border: 2px solid #fb923c;
            padding: 10px;
            border-radius: 10px;
            background: var(--white);
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            color: #7c2d12;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .service-card.selected {
            border-color: var(--primary-orange);
            background: var(--primary-orange);
            color: var(--white);
        }

        .courier-card {
            border: 2px solid #fb923c;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            background: var(--white);
            cursor: pointer;
            font-size: 13px;
        }

        .timeline {
            list-style: none;
            padding: 0;
            margin-top: 15px;
        }

        .timeline li {
            padding: 10px 0;
            border-right: 3px solid var(--primary-orange);
            margin-right: 8px;
            padding-right: 15px;
            position: relative;
            font-size: 13px;
        }

        .badge {
            background-color: var(--white);
            color: var(--dark-orange);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 12px;
            border: 1px solid #fb923c;
        }

        .summary-box {
            background: var(--white);
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #fb923c;
            margin-bottom: 12px;
            line-height: 1.6;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🚚 مسارك</h2>
    <div class="subtitle">منصة الشحن والخدمات اللوجستية الذكية</div>

    <!-- الخطوة 1: تسجيل الشحنة والخدمة -->
    <div id="step1" class="step-box active">
        <div class="badge">الخطوة 1: تفاصيل الشحنة والمسار</div>
        
        <div class="form-group">
            <label>🧭 نمط الخدمة اللوجستية:</label>
            <div class="service-type-grid">
                <div class="service-card selected" onclick="selectServiceType(this, 'من الباب للباب')">🚪 باب للباب</div>
                <div class="service-card" onclick="selectServiceType(this, 'من الباب للفرع')">🏢 باب للفرع</div>
                <div class="service-card" onclick="selectServiceType(this, 'من الفرع للباب')">📦 فرع للباب</div>
                <div class="service-card" onclick="selectServiceType(this, 'من الفرع للفرع')">🏬 فرع للفرع</div>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>📍 مدينة الاستلام:</label>
                <select id="pickupCity">
                    <option value="الرياض">الرياض</option>
                    <option value="جدة">جدة</option>
                    <option value="مكة المكرمة">مكة المكرمة</option>
                    <option value="الدمام">الدمام</option>
                    <option value="المدينة المنورة">المدينة المنورة</option>
                    <option value="أبها">أبها</option>
                    <option value="تبوك">تبوك</option>
                     <option value="جازان">جازان</option>
                </select>
            </div>
            <div class="form-group">
                <label>🏁 مدينة التسليم:</label>
                <select id="deliveryCity">
                    <option value="جدة">جدة</option>
                    <option value="الرياض">الرياض</option>
                    <option value="مكة المكرمة">مكة المكرمة</option>
                    <option value="الدمام">الدمام</option>
                    <option value="المدينة المنورة">المدينة المنورة</option>
                    <option value="أبها">أبها</option>
                 <option value="تبوك">تبوك</option>
                 <option value="جازان">جازان</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>⚖️ وزن وحجم الشحنة:</label>
            <select id="weightOption">
                <option value="ظرف مستندات (أقل من 1 كجم)">📄 ظرف مستندات (< 1 كجم)</option>
                <option value="صندوق صغير (1 - 5 كجم)">📦 صندوق صغير (1-5 كجم)</option>
                <option value="صندوق متوسط (5 - 15 كجم)">📦 صندوق متوسط (5-15 كجم)</option>
                <option value="شحنة ثقيلة (أكثر من 15 كجم)">📦 شحنة ثقيلة (> 15 كجم)</option>
            </select>
        </div>

        <div class="form-group">
            <label> ملاحظات إضافية (اختياري):</label>
            <textarea id="freeDescription" rows="2" placeholder="اكتب تفاصيل إضافية هنا..."></textarea>
        </div>

        <div class="form-group">
            <label>  وقت الجاهزية؟</label>
            <select id="readinessTime">
                <option value="جاهزة الآن">جاهزة الآن ⚡</option>
                <option value="خلال 12-18 ساعة">خلال 12 - 18 ساعة ⏱️</option>
                <option value="خلال 24-48 ساعة">خلال 24 - 48 ساعة 📅</option>
                <option value="خلال 3 أيام أو أكثر">خلال 3 أيام أو أكثر 🗓️</option>
            </select>
        </div>

        <button onclick="registerShipment()">التالي: حساب الخيارات ⬅</button>
    </div>

    <!-- الخطوة 2 و 3: الجدولة وعرض شركات الشحن -->
    <div id="step2" class="step-box">
        <div class="badge">الخطوة 2 & 3: الجدولة والأسعار</div>
        <div class="summary-box" id="shipmentInfoSummary"></div>
        <div id="couriersList"></div>
        <button class="secondary-btn" onclick="backToStep1()">🔙 تعديل البيانات</button>
    </div>

    <!-- الخطوة 4: تتبع الرحلة -->
    <div id="step3" class="step-box">
        <div class="badge">الخطوة 4: تتبع الرحلة 🛰️</div>
        <div class="summary-box" id="trackingDetails"></div>
        <button class="secondary-btn" onclick="resetApp()">🔄 شحنة جديدة</button>
    </div>
</div>

<script>
    let currentShipment = null;
    let selectedServiceType = 'من الباب للباب';

    function selectServiceType(element, type) {
        document.querySelectorAll('.service-card').forEach(c => c.classList.remove('selected'));
        element.classList.add('selected');
        selectedServiceType = type;
    }

    function registerShipment() {
        const pickupCity = document.getElementById('pickupCity').value;
        const deliveryCity = document.getElementById('deliveryCity').value;
        const weightOption = document.getElementById('weightOption').value;
        const freeDescription = document.getElementById('freeDescription').value || 'لا توجد ملاحظات';
        const readinessTime = document.getElementById('readinessTime').value;

        currentShipment = {
            id: 'MSK-' + Math.floor(100000 + Math.random() * 900000),
            serviceType: selectedServiceType,
            pickupCity,
            deliveryCity,
            weightOption,
            freeDescription,
            readinessTime
        };

        loadSchedule();
        window.scrollTo(0, 0);
    }

    function loadSchedule() {
        document.getElementById('shipmentInfoSummary').innerHTML = `
            رقم الشحنة: <b>${currentShipment.id}</b><br>
            الخدمة: <span style="color: #9a3412; font-weight: bold;">${currentShipment.serviceType}</span><br>
            المسار: من <b>${currentShipment.pickupCity}</b> إلى <b>${currentShipment.deliveryCity}</b><br>
            الجاهزية: <b>${currentShipment.readinessTime}</b>
        `;

        let durationText = "خلال يوم عمل واحد";
        if (currentShipment.readinessTime.includes('12-18')) durationText = "خلال 24 ساعة";
        if (currentShipment.readinessTime.includes('24-48')) durationText = "خلال 48 ساعة";
        if (currentShipment.readinessTime.includes('3 أيام')) durationText = "خلال 4 إلى 5 أيام";

        let priceMultiplier = 1;
        if (currentShipment.serviceType === 'من الباب للباب') priceMultiplier = 1.4;
        if (currentShipment.serviceType === 'من الفرع للفرع') priceMultiplier = 0.8;

        const couriers = [
            { name: 'مسارك إكسبريس (S速)', cost: Math.round(45 * priceMultiplier) + ' ريال', duration: durationText, rating: '4.9 ⭐' },
            { name: 'درة اللوجستية', cost: Math.round(35 * priceMultiplier) + ' ريال', duration: durationText, rating: '4.6 ⭐' },
            { name: 'الناقل الاقتصادي', cost: Math.round(20 * priceMultiplier) + ' ريال', duration: '3 - 4 أيام عمل', rating: '4.3 ⭐' }
        ];

        let couriersHtml = '<h4 style="color: #9a3412; margin-top: 0; font-size:14px;">اختر شركة الشحن:</h4>';
        couriers.forEach(c => {
            couriersHtml += `
                <div class="courier-card" onclick="goToTracking('${c.name}', '${c.duration}', '${c.cost}')">
                    <b>🏢 ${c.name}</b><br>
                    💰 التكلفة: ${c.cost} | ⏱️ المدة: ${c.duration} | ${c.rating}
                </div>
            `;
        });
        document.getElementById('couriersList').innerHTML = couriersHtml;

        document.getElementById('step1').classList.remove('active');
        document.getElementById('step2').classList.add('active');
        window.scrollTo(0, 0);
    }

    function goToTracking(courierName, deliveryDuration, cost) {
        document.getElementById('trackingDetails').innerHTML = `
            رقم الشحنة: <b>${currentShipment.id}</b><br>
            الخدمة: <b>${currentShipment.serviceType}</b><br>
            الناقل: <b>${courierName}</b> (${cost})<br>
            الحالة: <span style="color: #16a34a; font-weight: bold;">🟢 مؤكدة وتحت الإجراء</span><br>
            الوصول المتوقع: <b>${deliveryDuration}</b>
            <ul class="timeline">
                <li><b>تم استلام طلب الشحنة</b> (${currentShipment.serviceType})</li>
                <li><b>التجهيز في ${currentShipment.pickupCity}</b> والانطلاق</li>
                <li><b>في الطريق عبر خطوط السير</b> إلى ${currentShipment.deliveryCity}</li>
                <li><b>التسليم للعميل</b> (قريباً)</li>
            </ul>
        `;

        document.getElementById('step2').classList.remove('active');
        document.getElementById('step3').classList.add('active');
        window.scrollTo(0, 0);
    }

    function backToStep1() {
        document.getElementById('step2').classList.remove('active');
        document.getElementById('step1').classList.add('active');
        window.scrollTo(0, 0);
    }

    function resetApp() {
        document.getElementById('step3').classList.remove('active');
        document.getElementById('step1').classList.add('active');
        window.scrollTo(0, 0);
    }
</script>

</body>
</html>
